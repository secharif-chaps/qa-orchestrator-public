[tool.poetry]
name = "mint-back"
version = "0.1.0"
description = "Mint Backend Service"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115"
uvicorn = "0.22.0"
sqlalchemy = ">=2.0.35"
psycopg2-binary = ">=2.9.10"
pydantic = ">=2.10"
pydantic-settings = "2.0.1"
alembic = "1.11.1"
python-dotenv = "1.0.0"
httpx = ">=0.27"
asyncpg = ">=0.30.0"
aiohttp = "^3.12.7"
python-keycloak = "^3.9.1"
python-jose = "^3.3.0"
passlib = "^1.7.4"
email-validator = "^2.0.0"
langgraph = "^0.4"
langchain-openai = "^0.3"
openai = "^1.68"
langgraph-checkpoint-postgres = "^2.0"
psycopg = {version = "^3.1", extras = ["binary"]}
starlette = ">=0.36"
fastapi-keycloak = "1.1.1"
PyJWT = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
setuptools = "^80.9.0"
ruff = "^0.9.0"
mypy = "^1.15"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/", "tests/"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # bugbear (common pitfalls)
    "SIM",   # simplify (code simplification)
    "ASYNC", # async best practices
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function call in default argument (FastAPI Depends pattern)
    "B904",    # raise without from (needs manual review for proper exception chaining)
    "SIM102",  # nested if statements (style preference)
    "SIM105",  # use contextlib.suppress (style preference)
    "SIM108",  # use ternary operator (style preference)
    "ASYNC210",# blocking HTTP in async (needs httpx migration)
    "UP046",   # PEP 695 type params syntax (Generic[T] still widely used)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"