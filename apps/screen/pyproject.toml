[tool.poetry]
name = "chapsmind-screen"
version = "0.1.0"
description = "ChapsMind Screen Service"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115"
uvicorn = "^0.22"
sqlalchemy = ">=2.0.35"
psycopg2-binary = ">=2.9.10"
pydantic = ">=2.10"
pydantic-settings = "^2.12.0"
alembic = "^1.11"
python-dotenv = "1.0.0"
httpx = ">=0.27"
asyncpg = ">=0.30.0"
aiohttp = "^3.13.4"
python-keycloak = "^3.9.1"
python-jose = "^3.3.0"
email-validator = "^2.0.0"
langgraph = "^1.1"
langchain-openai = "^1.1"
openai = "^1.68"
langgraph-checkpoint-postgres = "^3.0"
psycopg = {version = "^3.1", extras = ["binary"]}
starlette = ">=0.36"
h11 = ">=0.16.0"
PyJWT = "^2.8.0"
yfinance = "^0.2.0"
lxml = "^5.3"
curl-cffi = "^0.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^4.1.0"
setuptools = "^80.9.0"
ruff = "^0.9.0"
mypy = "^1.15"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/", "tests/"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # bugbear (common pitfalls)
    "SIM",   # simplify (code simplification)
    "ASYNC", # async best practices
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function call in default argument (FastAPI Depends pattern)
    "B904",    # raise without from (needs manual review for proper exception chaining)
    "SIM102",  # nested if statements (style preference)
    "SIM105",  # use contextlib.suppress (style preference)
    "SIM108",  # use ternary operator (style preference)
    "ASYNC210",# blocking HTTP in async (needs httpx migration)
    "UP046",   # PEP 695 type params syntax (Generic[T] still widely used)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"