# Profile agent — A/B/C difficulty ladder.
#
# Scoring: 3 equal-weight assertions (is-json + schema + rubric), each worth 1/3.
# A single structural failure caps the score at 0.67, failing all passing thresholds.
#
# Tier A (threshold: 0.9) — must always pass, blocks CI on failure.
# Tier B (threshold: 0.7) — should reliably pass, tracked but advisory.
# Tier C (threshold: 0.0) — hard/ambiguous case, never blocks CI.

# Tier A: massive global brand, extensively documented everywhere — no excuse to fail.
- description: "profile/A — Apple (global public tech giant)"
  threshold: 0.9
  vars:
    _agent_name: "profile"  # routes Pydantic schema validation in validate_schema.py
    user_message: "Analyze company: Apple, website: apple.com"
    rubric: |
      Response correctly identifies Apple as an American multinational technology company.
      Must include: headquarters in Cupertino, California, founding year 1976,
      CEO Tim Cook, and business covering consumer electronics, software, or services.

# Tier B: real company but far less public data than Apple — meaningful quality bar.
- description: "profile/B — ChapsVision (French AI/ESG software company)"
  threshold: 0.7
  vars:
    _agent_name: "profile"
    user_message: "Analyze company: ChapsVision, website: chapsvision.com"
    rubric: |
      Response identifies ChapsVision as a French software or technology company
      related to AI, ESG, or data analytics/monitoring, with at least some
      meaningful profile data: HQ location, business description, or founding context.

# Tier C: lesser-known French fintech — advisory only, model knowledge may be limited.
- description: "profile/C — Pennylane (lesser-known French fintech)"
  threshold: 0
  vars:
    _agent_name: "profile"
    user_message: "Analyze company: Pennylane, website: pennylane.com"
    rubric: |
      Response identifies Pennylane as an accounting or fintech software company
      targeting SMBs or accountants in France, with relevant profile details.
