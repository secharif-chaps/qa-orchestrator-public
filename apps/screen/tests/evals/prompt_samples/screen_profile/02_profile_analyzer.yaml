  content: |
    # Profile Task - Dify Workflow Prompt

    ## Expected JSON Output Format

    ```typescript
    interface ProfileAnalysis {
      insights: string  // AI-generated analysis (source: "Chaps-e")
      groupName?: {
        value: string
        source: string
      }
      businessLine: {
        value: string
        source: string
      }
      catchphrase: {
        value: string
        source: string
      }
      establishmentYear: {
        value: string
        source: string
      }
      employeeCount: {
        value: string
        source: string
      }
      revenue: {
        value: string
        source: string
      }
      ceo: {
        value: string
        source: string
      }
      hq: {
        value: string
        source: string
      }
    }
    ```


    ---


    ## Full Prompt


    You are tasked with analyzing input text to extract comprehensive profile information about a company's structure and key details. Your goal is to identify and structure the output to match this exact JSON format:


    ```json
    {
      "insights": "A 2-3 sentence analysis summarizing the company's profile, market position, and key characteristics.",
      "groupName": {
        "value": "Parent Company Name",
        "source": "https://source-url.com"
      },
      "businessLine": {
        "value": "Primary business sector",
        "source": "https://source-url.com"
      },
      "catchphrase": {
        "value": "Company slogan or tagline",
        "source": "https://source-url.com"
      },
      "establishmentYear": {
        "value": "1976",
        "source": "https://source-url.com"
      },
      "employeeCount": {
        "value": "45k",
        "source": "https://source-url.com"
      },
      "revenue": {
        "value": "$2.5B",
        "source": "https://source-url.com"
      },
      "ceo": {
        "value": "Full Name",
        "source": "https://source-url.com"
      },
      "hq": {
        "value": "City, Country",
        "source": "https://source-url.com"
      }
    }
    ```


    ---


    ## CRITICAL: SOURCE PRIORITIZATION HIERARCHY


    You MUST follow this strict 3-tier priority system when extracting data. **ALWAYS use the highest-tier source available for each field.**


    ### Tier System Overview


    ```
    ┌─────────────────────────────────────────────────────────┐
    │ TIER 1: HIGHEST TRUST (Official & Verified Sources)    │
    │                                                         │
    │  Tier 1A: Company Website Scraping                     │
    │           - Official pages (/about, /team, /contact)   │
    │           - Most up-to-date, direct from source        │
    │                                                         │
    │  Tier 1B: Wikipedia (IF RELEVANT)                      │
    │           - Pre-filter: MUST be about this company     │
    │           - If relevant: HIGH TRUST (same as 1A)       │
    │           - If NOT relevant: IGNORE completely         │
    └─────────────────────────────────────────────────────────┘


    ┌─────────────────────────────────────────────────────────┐
    │ TIER 2: MEDIUM TRUST (Google Search Results)           │
    │         - Third-party sources (PitchBook, etc.)        │
    │         - May be outdated, verify when possible        │
    └─────────────────────────────────────────────────────────┘


    ┌─────────────────────────────────────────────────────────┐
    │ TIER 3: LOW TRUST (Knowledge Bases)                    │
    │         - Mistral KB, GPT KB                         │
    │         - Potentially outdated, use as last resort     │
    └─────────────────────────────────────────────────────────┘
    ```


    **Key Principle:** Tier 1A and 1B are EQUAL priority when both available. Tier 1 beats Tier 2. Tier 2 beats Tier 3.


    ---


    ### Tier 1: HIGHEST TRUST - Official & Verified Sources


    This tier includes sources that are highly reliable and up-to-date:


    #### Tier 1A: Company Website Scraping
    **Location in input:** `{{company}} complete website scraping results`
    **Data structure:** `{{scraped}}`


    **URL Priority Rules (within Tier 1):**
    1. **HIGHEST PRIORITY URLs** (official company pages):
       - `/about-us/`, `/about/`, `/about-us`, `/who-we-are/`
       - `/team/`, `/leadership/`, `/management/`
       - `/contact/`, `/contact-us/`
       - `/company/`, `/our-story/`


    2. **MEDIUM PRIORITY URLs** (informational pages):
       - `/careers/`, `/jobs/`
       - `/press/`, `/news/`
       - Job posting sites mentioning company (e.g., welcometothejungle.com)


    3. **LOWER PRIORITY URLs** (generic pages):
       - Homepage `/`
       - Product pages
       - Other sections


    **Why Tier 1A is Highest Trust:**
    - Most up-to-date information
    - Direct from official source
    - Contains current CEO, accurate founding date, latest employee count


    #### Tier 1B: Wikipedia (If Relevant to Company)
    **Location in input:** `{{wikipedia}}`


    **MANDATORY PRE-FILTER:**
    Before using Wikipedia, check:
    1. Does the Wikipedia page title mention the company name?
    2. Is the content actually about this company?


    **If YES (Wikipedia is about the company):**
    - **Trust Level**: HIGH TRUST - same as Tier 1A
    - Wikipedia company pages are generally well-maintained and accurate
    - Use for missing fields or to supplement Tier 1A data
    - Set the source to the exact URL of the Wikipedia page provided in the Tier 1B input data.
    Do NOT create or guess URLs from the company name. Use only URLs found in the scraped input.



    **If NO (Wikipedia is NOT about the company):**
    - **Action**: IGNORE COMPLETELY
    - Wikipedia node can return irrelevant results
    - Example: Company "ChapsVision" but Wikipedia returns "David Bowie" → IGNORE


    **Why Tier 1B is High Trust (when relevant):**
    - Wikipedia company pages are peer-reviewed and fact-checked
    - Historical information (founding, founders) especially reliable
    - Regularly updated by multiple contributors


    **When to use Tier 1B:**
    - For any missing fields not in Tier 1A
    - To supplement or confirm Tier 1A data
    - Historical information (founding year, founder names)


    ---


    ### Tier 2: MEDIUM TRUST - Google Search Scraping Results
    **Location in input:** `Specific Scraping results (medium trust) keep the scraped url as the source`
    **Data structure:** `{{items}}`


    **When to use:**
    - If Tier 1 (1A + 1B) doesn't contain the specific field you're looking for
    - For supplementary information not found on official sources


    **Caution:**
    - May contain outdated information
    - Cross-reference with Tier 1 when possible


    ### Tier 3: LOW TRUST - Knowledge Bases (Potentially Outdated)
    **Mistral KB location:** `{{mistral}}`
    **GPT KB location:** `{{gpt}}`


    **When to use:**
    - ONLY if Tier 1 and Tier 2 don't contain the field
    - Use as last resort for missing information


    **Why Low Trust:**
    - May be outdated (trained on old data)
    - Could contain incorrect information superseded by recent changes
    - Example: Old CEO names, outdated employee counts, wrong founding years


    **Source Attribution:**
    - For Mistral KB: Set source to `"Mistral Knowledge Base"`
    - For GPT KB: Set source to `"GPTKnowledge Base"`


    ---


    ## CONFLICT RESOLUTION RULES


    When multiple sources provide different values for the same field:


    **Rule 1: Always Use Highest Tier**
    ```
    Example:
    - Tier 1A (Website /about-us/): CEO = "Olivier Dellenbach"
    - Tier 3 (Mistral KB): CEO = "Philippe Ferre"
    → CORRECT OUTPUT: "Olivier Dellenbach" with source from Tier 1A
    ```


    **Rule 2: Within Tier 1A, Prefer Official Pages**
    ```
    Example (both from Tier 1A - website):
    - URL: /about-us/ → CEO = "John Smith"
    - URL: /careers/ → CEO = "Jane Doe"
    → CORRECT OUTPUT: "John Smith" (from /about-us/)
    ```


    **Rule 3: Tier 1A and 1B are Equal Priority**
    ```
    When both Tier 1A (website) and Tier 1B (relevant Wikipedia) have the same field:
    - Prefer Tier 1A if the data is complete and recent
    - Use Tier 1B for historical context or when Tier 1A is vague
    - Both are HIGH TRUST - use judgment based on context


    Example:
    - Tier 1A: Founded = "2012"
    - Tier 1B (Wikipedia): Founded = "September 2012" (more specific)
    → ACCEPTABLE: Either "2012" or "September 2012" (both high trust)
    ```


    **Rule 4: Ignore Lower-Tier Conflicting Data**
    ```
    Do NOT mention or include data from lower tiers when higher tier exists.
    Only extract from the highest tier available.
    ```


    **Rule 5: Never Return Empty If Lower Tiers Have Data**


    If a field is missing or marked as "Not specified" in Tier 1A:
    1. Check Tier 1B (Wikipedia, if relevant about the company)
    2. Check Tier 2 (Google search) - if present, use it
    3. If not in Tier 2, check Tier 3 (Knowledge bases)
    4. ONLY return empty "" if NO tier has the data


    **Example:**
    ```
    - Tier 1A (Website): CEO = "Not specified in provided content"
    - Tier 1B (Wikipedia): Not relevant (ignored)
    - Tier 2 (Google): CEO = "John Smith"
    - Tier 3 (KB): CEO = "Jane Doe"
    → CORRECT OUTPUT: "John Smith" from Tier 2 (highest tier with actual data)
    → WRONG OUTPUT: "" (empty - never do this when lower tiers have data)
    ```


    **When Multiple Lower Tiers Conflict:**


    If Tier 1A is missing and Tier 1B/2/3 have different values, use the HIGHEST tier among those that have data.


    Example 1 (Wikipedia NOT relevant):
    ```
    - Tier 1A (Website): CEO = "Not specified"
    - Tier 1B (Wikipedia): IGNORED (about different company)
    - Tier 2 (Google/PitchBook): CEO = "Sebastian Burch"
    - Tier 3 (Mistral KB): CEO = "Sébastien Nicoleau"
    → CORRECT OUTPUT: "Sebastian Burch" from Tier 2
    → REASONING: Tier 2 is highest available tier with actual data
    ```


    Example 2 (Wikipedia IS relevant):
    ```
    - Tier 1A (Website): CEO = "Not specified"
    - Tier 1B (Wikipedia): CEO = "Sébastien Bougon" (founder) ✅ Relevant page
    - Tier 2 (Google/PitchBook): CEO = "Sebastian Burch"
    - Tier 3 (Mistral KB): CEO = "Sébastien Nicoleau"
    → CORRECT OUTPUT: "Sébastien Bougon" from Tier 1B (Wikipedia)
    → REASONING: Tier 1B is same priority as Tier 1A, beats Tier 2/3
    ```


    **Rule 6: Tier Priority Beats Specificity**


    When higher-tier data is less specific than lower-tier data, STILL use the higher-tier data.


    **Example:**
    ```
    - Tier 1A (Website): HQ = "France"
    - Tier 3 (KB): HQ = "Suresnes, France"
    → CORRECT OUTPUT: "France" with Tier 1A source
    → WRONG OUTPUT: "Suresnes, France" with Tier 3 source (violates tier priority)
    ```


    **Why:** Even vague Tier 1 data is more trustworthy than specific lower-tier data. Source reliability matters more than data completeness.


    **Exception for Tier 1B:**
    If Tier 1B (relevant Wikipedia) has more specific data than Tier 1A, you can use Tier 1B since they're equal priority.


    ---


    ## EXTRACTION REQUIREMENTS


    ### 1. insights (REQUIRED - AI Generated)
    - **Source:** Always set to `"Chaps-e"` (this is AI-generated analysis)
    - A 2-3 sentence summary analyzing the company's profile
    - Include: market position, key strengths, notable characteristics
    - Example: "ChapsVision is a rapidly growing French AI company founded in 2019, positioning itself as a leader in data analytics solutions. With over 1,000 employees and strong venture backing, the company has established a significant presence in the European enterprise software market."


    ### 2. groupName (optional)
    - Parent company or holding group name
    - If independent, use "Independent" or omit field
    - Format: Clean company name (e.g., "Alphabet Inc.", "LVMH Group")


    ### 3. businessLine (required)
    - Primary business sector/industry
    - Format: Clear sector description (e.g., "Cloud Computing & Software", "Luxury Goods & Retail")


    ### 4. catchphrase (required)
    - Official company slogan or tagline
    - Format: Exact official slogan (e.g., "Think Different", "Just Do It")


    ### 5. establishmentYear (required)
    - Company founding year
    - Format: Year only (e.g., "1976", "2004", "2019")
    - **Common mistake:** Don't use outdated KB year if website has correct year


    ### 6. employeeCount (required)
    - Total number of employees
    - Format rules:
      - Under 1,000: exact number (e.g., "450", "750")
      - 1,000-9,999: use "k" (e.g., "2.5k", "8k")
      - 10,000+: use "k" (e.g., "45k", "180k")
    - **Common mistake:** Don't use outdated KB count if website has current count


    ### 7. revenue (required)
    - Annual revenue/turnover
    - Format rules:
      - Under $1M: exact with "k" (e.g., "$450k", "€750k")
      - $1M-$999M: use "M" (e.g., "$15M", "€22M")
      - $1B+: use "B" (e.g., "$2.5B", "€45B")
      - Always include currency symbol first


    ### 8. ceo (required)
    - Current CEO name
    - Format: Full name (e.g., "Tim Cook", "Satya Nadella")
    - **Common mistake:** Using outdated CEO from KB when website shows current CEO


    ### 9. hq (required)
    - Headquarters location
    - Format: City, Country (e.g., "Cupertino, USA", "Paris, France")


    ---


    ## STEP-BY-STEP EXTRACTION PROCESS


    ### Step 1: Pre-Filter Wikipedia
    - Check if Wikipedia page is relevant to the company
    - If irrelevant (wrong company/person), mark Wikipedia as "SKIP" (ignore completely)
    - If relevant (page is about the company), mark Wikipedia as "TIER 1B" (HIGH TRUST)


    ### Step 2: Identify Available Data in Tier 1
    - Scan Tier 1A (website scraping) for all fields
    - Scan Tier 1B (relevant Wikipedia, if applicable) for all fields
    - Identify which fields are present in Tier 1 sources


    ### Step 3: Extract from Tier 1 First
    - For each field found in Tier 1A or 1B:
      - Within Tier 1A, prioritize official page URLs (/about, /team, /contact)
      - Tier 1A and 1B are equal priority - prefer 1A if both have complete data
      - Extract value
      - Record exact source URL


    ### Step 4: Fill Gaps from Lower Tiers
    - For fields NOT found in Tier 1A or 1B OR marked as "Not specified":
      - Check Tier 2 (Google search scraping) - if field exists, extract it
      - If not in Tier 2, check Tier 3 (knowledge bases)
      - When multiple lower tiers have the field, use the HIGHEST tier's value
      - NEVER return empty if ANY tier has the data


    ### Step 5: Generate Insights
    - Based on ALL extracted data, write a 2-3 sentence analysis
    - Set source to `"Chaps-e"` (AI-generated content)
    - Include key observations about the company's profile


    ### Step 6: Format and Validate
    - Apply format rules to all extracted values
    - Ensure source URLs are preserved exactly as found
    - Double-check no lower-tier data overwrote higher-tier data


    ---


