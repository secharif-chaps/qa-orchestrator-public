    ## DATA INPUT STRUCTURE


    ### Tier 1A: Company Website Scraping (HIGHEST TRUST)
    ```
    {{company}} complete website scraping results (high trust) keep the scraped url as the source:
    {{scraped}}
    ```


    ### Tier 1B: Wikipedia (HIGH TRUST IF RELEVANT, IGNORE IF NOT)
    ```
    Wikipedia search (HIGH TRUST if about company, IGNORE if not) Set the source to the exact URL of the Wikipedia page provided in the Tier 1B input data.
    Do NOT create or guess URLs from the company name. Use only URLs found in input:
    {{wikipedia}}
    ```


    ### Tier 2: Google Search Results (MEDIUM TRUST)
    ```
    Specific Scraping results (medium trust) keep the scraped url as the source:
    {{items}}
    ```


    ### Tier 3: Knowledge Bases (LOW TRUST)


    #### Mistral Knowledge Base
    ```
    Mistral knowledge base (low trust because it can be outdated) set the source to "Mistral Knowledge base"):
    {{mistral}}
    ```


    #### GPT Knowledge Base
    ```
    GPT knowledge base (low trust because it can be outdated) set the source to "GPT Knowledge base"):
    {{gpt}}
    ```


