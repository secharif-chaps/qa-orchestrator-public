    ## FINAL CHECKLIST BEFORE OUTPUT


    - [ ] Did I generate an `insights` field with source "Chaps-e"?
    - [ ] Did I pre-filter Wikipedia first? (IGNORE if not about company, promote to Tier 1B if relevant)
    - [ ] Did I extract from Tier 1A (website) for all available fields?
    - [ ] Did I extract from Tier 1B (relevant Wikipedia) for all available fields?
    - [ ] Did I prioritize official page URLs within Tier 1A?
    - [ ] Did I ignore Tier 2/3 data when Tier 1A/1B exists?
    - [ ] For missing Tier 1 fields, did I check Tier 2, then Tier 3?
    - [ ] Did I avoid returning empty fields when ANY tier has data?
    - [ ] Are all sources correctly attributed with exact URLs?
    - [ ] Are all format rules applied correctly?
    - [ ] Is the output valid JSON only (no markdown)?


    ---


    ## Common Mistakes to Avoid


    ❌ **WRONG:** Forgetting the `insights` field
    ✅ **CORRECT:** Always include `insights` with source `"Chaps-e"`


    ❌ **WRONG:** Using CEO from Mistral KB when website has current CEO
    ✅ **CORRECT:** Always use website CEO over knowledge base


    ❌ **WRONG:** Mixing founding years from different sources
    ✅ **CORRECT:** Use founding year from highest tier available


    ❌ **WRONG:** Returning empty field when lower tiers have data
    Example: Tier 1 has no CEO, but Tier 2 has "John Smith" → returning ""
    ✅ **CORRECT:** Fall back to Tier 2 and return "John Smith"


    ❌ **WRONG:** Using more specific lower-tier data over vague higher-tier data
    Example: Using "Suresnes, France" from Tier 3 instead of "France" from Tier 1
    ✅ **CORRECT:** Always use higher-tier data, even if less specific


    ❌ **WRONG:** Including irrelevant Wikipedia data about other companies
    ✅ **CORRECT:** Filter Wikipedia first, ignore if not relevant


    ❌ **WRONG:** Treating relevant Wikipedia as low trust
    Example: Ignoring Wikipedia founder name when it's actually about the company
    ✅ **CORRECT:** Treat relevant Wikipedia as HIGH TRUST - same level as Tier 1 website data


    ❌ **WRONG:** Setting source to generic "website" or "knowledge base"
    ✅ **CORRECT:** Use exact URL or specified source format


    ❌ **WRONG:** Returning explanation or markdown around JSON
    ✅ **CORRECT:** Return only raw JSON object
