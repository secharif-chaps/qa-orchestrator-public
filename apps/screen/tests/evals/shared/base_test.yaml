options:
  provider:
    id: "openai:chat:{{env.LLM_RUBRIC_MODEL}}"
    config:
      apiKey: "{{env.LLM_GATEWAY_API_KEY}}"
      apiBaseUrl: "{{env.LLM_GATEWAY_BASE_URL}}"

assert:
  # Equal-weight scoring: each assertion contributes 1/3 to the overall score.
  # A single structural failure (score=0) caps the total at 0.67 — below all
  # passing thresholds (tier A: 0.9, tier B: 0.7). Quality alone cannot rescue
  # a structurally invalid output.

  # Binary — output must be valid JSON before any further checks.
  - type: is-json
    metric: structural

  # Binary — Pydantic schema validation, dispatched by _agent_name var.
  - type: python
    metric: structural
    value: file://../assertions/validate_schema.py

  # Scored (0–1) — judge model evaluates output against per-test rubric criteria.
  - type: llm-rubric
    metric: quality
    value: "{{rubric}}"
