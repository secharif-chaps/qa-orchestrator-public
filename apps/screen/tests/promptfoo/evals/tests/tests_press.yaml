# Press agent — A/B/C difficulty ladder.
#
# What this agent does: finds press coverage — articles, press releases,
# media mentions, awards, product launches.
#
# Rubric goal: non-empty items list with valid type enum values.

- description: "press/A — Apple (extensively covered in media)"
  threshold: 0.9
  vars:
    _agent_name: "press"
    user_message: |
      Research the following company: Apple
      Website: apple.com
    rubric: |
      items list must contain at least 3 entries.
      Each item type must be one of: article, press_release, media_mention, award, product_launch, interview, financial, partnership.
      At least one item must have a non-null source URL.

- description: "press/B — LVMH (French luxury group with regular press coverage)"
  threshold: 0.7
  vars:
    _agent_name: "press"
    user_message: |
      Research the following company: LVMH
      Website: lvmh.com
    rubric: |
      items list must contain at least 1 entry.
      Item types must be valid enum values.
      insights should reference luxury, fashion, or corporate news.

- description: "press/C — Small French company with limited press coverage"
  threshold: 0
  vars:
    _agent_name: "press"
    user_message: |
      Research the following company: Pappers
      Website: pappers.fr
    rubric: |
      Output is a valid PressAgentOutput JSON.
      items list may be empty or sparse for a less prominent company.
