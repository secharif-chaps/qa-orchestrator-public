# Products agent — A/B/C difficulty ladder.
#
# What this agent does: identifies product range, categories, partner brands,
# private labels, marketing positioning.
#
# Rubric goal: at least one product category or range item identified.

- description: "products/A — Apple (clear product range: iPhone, Mac, iPad, etc.)"
  threshold: 0.9
  vars:
    _agent_name: "products"
    user_message: |
      Research the following company: Apple
      Website: apple.com
    rubric: |
      range or categories must contain at least 2 entries.
      Product names should reference iPhone, Mac, iPad, Apple Watch, or similar.
      customer_type or marketing_positioning should reference consumer or premium.

- description: "products/B — L'Oréal (French FMCG with multiple product lines)"
  threshold: 0.7
  vars:
    _agent_name: "products"
    user_message: |
      Research the following company: L'Oréal
      Website: loreal.com
    rubric: |
      range or categories must contain at least 1 entry.
      Products should reference cosmetics, beauty, skincare, or haircare.
      partner_brands or private_labels may reference brand subsidiaries.

- description: "products/C — Small niche company with limited product data"
  threshold: 0
  vars:
    _agent_name: "products"
    user_message: |
      Research the following company: Pappers
      Website: pappers.fr
    rubric: |
      Output is a valid ProductsAgentOutput JSON.
      Any populated field is acceptable.
