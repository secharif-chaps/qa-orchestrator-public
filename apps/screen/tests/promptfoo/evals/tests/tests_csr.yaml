# CSR agent — A/B/C difficulty ladder.
#
# What this agent does: identifies CSR/ESG initiatives categorized as:
# responsibility, charity, sustainability, community, diversity, ethics, awards.
#
# Rubric goal: at least one initiative with a valid CSR category.

- description: "csr/A — Apple (extensive ESG/CSR reporting)"
  threshold: 0.9
  vars:
    _agent_name: "csr"
    user_message: |
      Research the following company: Apple
      Website: apple.com
    rubric: |
      items list must contain at least 3 entries.
      Each item type must be one of: responsibility, charity, sustainability, community, diversity, ethics, awards.
      At least one item should reference environmental or sustainability initiatives.
      insights must be non-null.

- description: "csr/B — TotalEnergies (French energy company with strong ESG focus)"
  threshold: 0.7
  vars:
    _agent_name: "csr"
    user_message: |
      Research the following company: TotalEnergies
      Website: totalenergies.com
    rubric: |
      items list must contain at least 1 entry with a valid type.
      sustainability or responsibility type expected given energy sector.
      insights should reference ESG, environment, or energy transition.

- description: "csr/C — Small company with limited CSR data"
  threshold: 0
  vars:
    _agent_name: "csr"
    user_message: |
      Research the following company: Pappers
      Website: pappers.fr
    rubric: |
      Output is a valid CsrAgentOutput JSON.
      Sparse or empty results acceptable for a company with little CSR reporting.
