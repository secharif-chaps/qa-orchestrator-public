# Digital agent — A/B/C difficulty ladder.
#
# What this agent does: identifies digital presence — social media accounts,
# online services, app stores, digital strategy, loyalty programs.
#
# Rubric goal: at least one social account or digital service identified.

- description: "digital/A — Apple (major digital presence, App Store, social media)"
  threshold: 0.9
  vars:
    _agent_name: "digital"
    user_message: |
      Research the following company: Apple
      Website: apple.com
    rubric: |
      social_media_accounts must contain at least one entry (Twitter/X, LinkedIn, YouTube, or Instagram).
      online_services should reference App Store, iCloud, or Apple TV+.
      At least 2 non-null top-level fields populated.

- description: "digital/B — BNP Paribas (French bank with digital banking services)"
  threshold: 0.7
  vars:
    _agent_name: "digital"
    user_message: |
      Research the following company: BNP Paribas
      Website: bnpparibas.com
    rubric: |
      At least one social media account or online service identified.
      digital_strategy or online_services should reference banking app or digital banking.
      Partial data is acceptable.

- description: "digital/C — Small French company with limited digital footprint"
  threshold: 0
  vars:
    _agent_name: "digital"
    user_message: |
      Research the following company: Pappers
      Website: pappers.fr
    rubric: |
      Output is a valid DigitalAgentOutput JSON.
      At least one field attempted to be populated, even if data is sparse.
