# Screen Backend GitLab CI/CD Pipeline
# Lints, tests, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

# ─── Reusable blocks ───────────────────────────────────
# Run all jobs on any branch (not just when files change)
.screen-changes: &screen-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Lint Stage ────────────────────────────────────────
screen:poetry-check:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/screen && poetry check && poetry check --lock
  <<: *screen-changes

screen:lint:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/screen && ruff check app/
  <<: *screen-changes

screen:logger-extra-check:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/screen/**/*.py
        - .gitlab/scripts/check-logger-extra.py
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/screen/**/*.py
        - .gitlab/scripts/check-logger-extra.py
  script:
    - python3 .gitlab/scripts/check-logger-extra.py apps/screen

screen:alembic-check:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/screen/alembic/versions/**/*
        - .gitlab/scripts/check-alembic.sh
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/screen/alembic/versions/**/*
        - .gitlab/scripts/check-alembic.sh
  before_script:
    - cd apps/screen
    - poetry config virtualenvs.create false && poetry install --no-interaction --no-root
  script:
    - cd $CI_PROJECT_DIR && .gitlab/scripts/check-alembic.sh apps/screen

screen:mypy:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  before_script:
    - cd apps/screen
    - poetry config virtualenvs.create false && poetry install --no-interaction
  script:
    - mypy app/ --ignore-missing-imports
  allow_failure: true
  <<: *screen-changes

screen:poetry-audit:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/screen && poetry audit --ignore-package=ecdsa
  <<: *screen-changes

# ─── Test Stage ────────────────────────────────────────

# Shared test setup (no DB needed)
.screen-test-base: &screen-test-base
  stage: test
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  before_script:
    - cd apps/screen
    - poetry config virtualenvs.create false && poetry install --no-interaction
  <<: *screen-changes

# Unit tests — fast, no external dependencies, must pass
screen:test:unit:
  <<: *screen-test-base
  needs: []
  script:
    - pytest tests/unit/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=35 --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/screen/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/screen/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'

# Integration tests — require Postgres, slower
screen:test:integration:
  <<: *screen-test-base
  needs: []
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: chapsmind_db_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/chapsmind_db_test"
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/chapsmind_db_test"
  before_script:
    - cd apps/screen
    - poetry config virtualenvs.create false && poetry install --no-interaction
    # Wait for Postgres to be ready, create schema, run migrations
    - |
      python -c "
      import time, psycopg2
      for i in range(30):
          try:
              c = psycopg2.connect('$DATABASE_URL')
              c.autocommit = True
              c.cursor().execute('CREATE SCHEMA IF NOT EXISTS screen_schema')
              c.close()
              print('Postgres ready')
              break
          except Exception:
              time.sleep(1)
      else:
          raise RuntimeError('Postgres ($DATABASE_URL) not ready after 30s')
      "
    - alembic upgrade head
  script:
    - pytest tests/integration/ -v --no-cov --junitxml=report-integration.xml -m integration
  artifacts:
    when: always
    reports:
      junit: apps/screen/report-integration.xml

# ─── Bandit — Python security analysis ───────────────
screen:bandit:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  variables:
    # Skip false positives: bind 0.0.0.0 (Docker), 'bearer' passwords, try/except/pass, random
    BANDIT_SKIPS: B104,B105,B106,B110,B112,B311
  script:
    - cd apps/screen
    - pip install -q bandit==1.8.3
    - bandit -r app/ --skip ${BANDIT_SKIPS} -f json -o bandit-report.json || BANDIT_RC=$?
    - bandit -r app/ --skip ${BANDIT_SKIPS} || true
    - exit ${BANDIT_RC:-0}
  artifacts:
    paths:
      - apps/screen/bandit-report.json
    when: always
    expire_in: 7 days
  <<: *screen-changes

# ─── Evals Stage (promptfoo LLM regression tests) ─────
# Runs LLM prompt regression tests with promptfoo.
screen:promptfoo:evals:

  stage: test  # Runs after lint, in parallel with unit/integration tests
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci-node:latest
  needs: [screen:lint]
  allow_failure: true
  interruptible: true
  timeout: 20m

  script:
    - RUN_ID="sha-${CI_COMMIT_SHORT_SHA}" bash apps/screen/tests/promptfoo/evals/run_evals.sh --no-cache

  # ── Trigger filter ────────────────────────────────────────────────────────
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never  # Scheduled pipelines handled separately (nightly eval job)
    - if: $AGENT_ISSUE
      when: never  # agent-os automation pipelines
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/screen/app/agents/prompts/**/*
        - apps/screen/tests/promptfoo/evals/**/*
        - apps/screen/tests/promptfoo/shared/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/screen/app/agents/prompts/**/*
        - apps/screen/tests/promptfoo/evals/**/*
        - apps/screen/tests/promptfoo/shared/**/*

  artifacts:
    paths:
      - apps/screen/tests/promptfoo/evals/results/*.json
    when: always
    expire_in: 30 days

# ─── Redteam Stage (promptfoo adversarial probing) ────
# Replays committed adversarial probes (no generation). Advisory only.
screen:promptfoo:redteam:

  stage: test
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci-node:latest
  needs: [screen:lint]
  allow_failure: true
  interruptible: true
  timeout: 15m

  script:
    - RUN_ID="sha-${CI_COMMIT_SHORT_SHA}" bash apps/screen/tests/promptfoo/redteam/run_redteam.sh --no-cache

  # ── Trigger filter ────────────────────────────────────────────────────────
  # MR: auto on prompt/redteam changes so reviewers see the security report
  # Branch push: manual-only — advisory job, too expensive to auto-run on every push
  rules:
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/screen/app/agents/prompts/**/*
        - apps/screen/tests/promptfoo/redteam/**/*
        - apps/screen/tests/promptfoo/shared/providers.yaml
    - if: $CI_COMMIT_BRANCH
      when: manual

  artifacts:
    paths:
      - apps/screen/tests/promptfoo/redteam/results/*.json
    when: always
    expire_in: 30 days

# ─── Publish (build + tag + push) ─────────────────────
screen:publish:
  interruptible: false
  extends: .docker-publish
  needs: [screen:lint, screen:poetry-check, screen:poetry-audit, screen:test:unit, screen:test:integration]
  variables:
    IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-screen
    DOCKER_CONTEXT: apps/screen

# ─── Scan Stage (Trivy) ──────────────────────────────
screen:trivy:
  extends: .trivy-scan
  needs: [screen:publish]
  variables:
    SCAN_IMAGE: ${CI_REGISTRY_IMAGE}/chapsmind-screen
