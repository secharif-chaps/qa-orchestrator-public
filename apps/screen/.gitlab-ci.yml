# Screen Backend GitLab CI/CD Pipeline
# Lints, tests, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-screen
  DOCKER_BUILDKIT: 1

# ─── Reusable blocks ───────────────────────────────────
# Run all jobs on any branch (not just when files change)
.screen-changes: &screen-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Lint Stage ────────────────────────────────────────
screen:poetry-check:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/screen && poetry check && poetry check --lock
  <<: *screen-changes

screen:lint:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/screen && ruff check app/
  <<: *screen-changes

screen:mypy:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/screen && poetry config virtualenvs.create false && poetry install --no-interaction
    - cd apps/screen && mypy app/ --ignore-missing-imports
  allow_failure: true
  <<: *screen-changes

screen:poetry-audit:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/screen && poetry audit
  <<: *screen-changes

# ─── Test Stage ────────────────────────────────────────

# Shared test setup (no DB needed)
.screen-test-base: &screen-test-base
  stage: test
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  before_script:
    - cd apps/screen
    - poetry config virtualenvs.create false && poetry install --no-interaction
  <<: *screen-changes

# Unit tests — fast, no external dependencies, must pass
screen:test:unit:
  <<: *screen-test-base
  needs: []
  script:
    - pytest tests/unit/ tests/test_worldcheck/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=35 --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/screen/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/screen/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'

# Integration tests — require Postgres, slower
screen:test:integration:
  <<: *screen-test-base
  needs: []
  services:
    - name: postgres:15-alpine
      alias: postgres
  variables:
    POSTGRES_DB: chapsmind_db_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/chapsmind_db_test"
    DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/chapsmind_db_test"
  before_script:
    - cd apps/screen
    - poetry config virtualenvs.create false && poetry install --no-interaction
    # Create schema and run migrations so migration tests find existing tables
    - PGPASSWORD=postgres psql -h postgres -U postgres -d chapsmind_db_test -c "CREATE SCHEMA IF NOT EXISTS screen_schema;" || true
    - alembic upgrade head
  script:
    - pytest tests/integration/ -v --no-cov --junitxml=report-integration.xml
  artifacts:
    when: always
    reports:
      junit: apps/screen/report-integration.xml

# ─── Build Stage (Docker) ─────────────────────────────
.screen-docker-build:
  image: docker:29-cli
  script:
    - echo "Building $IMAGE_NAME:${IMAGE_TAG}"
    - docker build --no-cache --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/screen/

# Build test (don't push) - runs on all branches
screen:docker-build:
  stage: build
  extends: .screen-docker-build
  needs: [screen:lint, screen:poetry-check, screen:poetry-audit, screen:test:unit, screen:test:integration]
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Main branch: build + push with SHA tag and :latest
# DISABLED: Do not publish on this test branch
screen:publish:
  stage: publish
  extends: .screen-docker-build
  needs: [screen:docker-build]
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_NAME}:latest"
    - docker push "${IMAGE_NAME}:latest"
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
