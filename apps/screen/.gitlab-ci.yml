# Screen Backend GitLab CI/CD Pipeline
# Builds and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-screen
  IMAGE_TAG: preprod
  DOCKER_BUILDKIT: 1

.screen-rules: &screen-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/screen/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/screen/**/*

screen:lint:
  stage: CodingStandards
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - cd apps/screen && ruff check app/
  <<: *screen-rules

screen:test:
  stage: CodingStandards
  image: python:3.12-slim
  before_script:
    - pip install poetry
    - cd apps/screen
    - poetry config virtualenvs.create false && poetry install --no-interaction
  script:
    - pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/screen/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/screen/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  <<: *screen-rules

.build:
  image: docker:29-cli
  script:
    - echo Building $IMAGE_NAME:$IMAGE_TAG
    - docker build --no-cache --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/screen/

screen:build:
  stage: Build
  extends: .build
  <<: *screen-rules

screen:publish:
  stage: Publish
  extends: .build
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push $IMAGE_NAME:${IMAGE_TAG}
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/screen/**/*
