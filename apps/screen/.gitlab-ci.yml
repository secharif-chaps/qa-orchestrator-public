# Screen Backend GitLab CI/CD Pipeline
# Lints, tests, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-screen
  DOCKER_BUILDKIT: 1

# ─── Reusable blocks ───────────────────────────────────
.screen-changes: &screen-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/screen/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/screen/**/*

# ─── Lint Stage ────────────────────────────────────────
screen:lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - cd apps/screen && ruff check app/
  <<: *screen-changes

# ─── Test Stage ────────────────────────────────────────
screen:test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install poetry
    - cd apps/screen
    - poetry config virtualenvs.create false && poetry install --no-interaction
  script:
    - pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/screen/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/screen/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  <<: *screen-changes

# ─── Build Stage (Docker) ─────────────────────────────
.screen-docker-build:
  image: docker:29-cli
  script:
    - echo "Building $IMAGE_NAME:${IMAGE_TAG}"
    - docker build --no-cache --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/screen/

# MR: test that docker build succeeds (don't push)
screen:docker-build:
  stage: build
  extends: .screen-docker-build
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/screen/**/*

# Main branch: build + push with SHA tag and :latest
screen:publish:
  stage: publish
  extends: .screen-docker-build
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_NAME}:latest"
    - docker push "${IMAGE_NAME}:latest"
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/screen/**/*
