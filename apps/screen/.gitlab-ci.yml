# Screen Backend GitLab CI/CD Pipeline
# Builds and publishes Docker image to GitLab Container Registry on main branch

stages:
  - build
  - publish

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-screen
  IMAGE_TAG: preprod
  DOCKER_BUILDKIT: 1

# ---- Rules ----

.default-rules: &default-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/screen/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/screen/**/*

# ---- Build template ----

.build:
  image: docker:29-cli
  script:
    - echo Building $IMAGE_NAME:$IMAGE_TAG
    - docker build --no-cache --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/screen/

# ---- Build Stage ----

build:
  stage: build
  extends: .build
  <<: *default-rules

# ---- Publish Stage ----

publish:
  stage: publish
  extends: .build
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push $IMAGE_NAME:${IMAGE_TAG}
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/screen/**/*