# Target Backend GitLab CI/CD Pipeline (PHP / Symfony / FrankenPHP)
# Lints, tests, validates n8n workflows, and publishes Docker image
# Stages are defined in the root .gitlab-ci.yml

# ─── Reusable blocks ───────────────────────────────────
.target-changes: &target-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.target-php-job: &target-php-job
  image: ${CI_REGISTRY}/chapsmind/ci-images/php-target:latest
  <<: *target-changes
  before_script:
    - cd apps/target
    - composer install --no-interaction --no-progress --prefer-dist

# ─── Lint Stage ────────────────────────────────────────
target:cs-check:
  <<: *target-php-job
  stage: lint
  needs: []
  script:
    - php vendor/bin/ecs check --config=ecs.php

target:phpstan:
  <<: *target-php-job
  stage: lint
  needs: []
  script:
    - php -d memory_limit=2G vendor/bin/phpstan analyse --memory-limit=2G

# ─── Test Stage ────────────────────────────────────────
target:test:unit:
  <<: *target-php-job
  stage: test
  needs: []
  script:
    - php vendor/bin/phpunit --testsuite "Unit tests" --coverage-text --coverage-cobertura=coverage.xml --log-junit=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/target/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/target/coverage.xml
  coverage: '/Lines:\s+(\d+\.\d+)%/'

target:test:integration:
  <<: *target-php-job
  stage: test
  needs: []
  services:
    - name: valkey/valkey:8
      alias: valkey
    - name: postgres:17-alpine
      alias: database-test
      variables:
        DOCKER_SHM_SIZE: 268435456
        POSTGRES_DB: app_test
        POSTGRES_PASSWORD: test
        POSTGRES_USER: test
        POSTGRES_INITDB_ARGS: --auth-host=trust --auth-local=trust
    - name: opensearchproject/opensearch:2
      alias: opensearch-test
      variables:
        discovery.type: single-node
        OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        DISABLE_SECURITY_PLUGIN: "true"
        DISABLE_INSTALL_DEMO_CONFIG: "true"
        cluster.routing.allocation.disk.threshold_enabled: "false"
        OPENSEARCH_INITIAL_ADMIN_PASSWORD: ""
  variables:
    APP_ENV: test
    DATABASE_URL: "postgresql://test:test@database-test:5432/app_test?serverVersion=17&charset=utf8"
    OPENSEARCH_URL: "http://opensearch-test:9200"
    VALKEY_DSN: "redis://valkey:6379"
    DB_HOST: database-test
    DB_PORT: 5432
    ATTEMPTS_LEFT_TO_REACH_DATABASE: 60
    ATTEMPTS_LEFT_TO_REACH_OPENSEARCH: 120
  before_script:
    - cd apps/target
    - composer install --no-interaction --no-progress --prefer-dist
    # Wait for PostgreSQL
    - |
      until [ $ATTEMPTS_LEFT_TO_REACH_DATABASE -eq 0 ] || pg_isready -h "$DB_HOST" -p "$DB_PORT" -U test 2>/dev/null; do
        sleep 1
        ATTEMPTS_LEFT_TO_REACH_DATABASE=$((ATTEMPTS_LEFT_TO_REACH_DATABASE - 1))
        echo "Waiting for database... $ATTEMPTS_LEFT_TO_REACH_DATABASE attempts left."
      done
      if [ $ATTEMPTS_LEFT_TO_REACH_DATABASE -eq 0 ]; then
        echo "Database not ready"; exit 1
      fi
      echo "Database is ready"
    # Wait for OpenSearch
    - |
      echo "Waiting for OpenSearch..."
      until [ $ATTEMPTS_LEFT_TO_REACH_OPENSEARCH -eq 0 ]; do
        OS_HEALTH=$(curl -s "$OPENSEARCH_URL/_cluster/health" 2>/dev/null || echo "")
        if echo "$OS_HEALTH" | grep -qE '"status":"(green|yellow)"'; then
          echo "OpenSearch cluster is healthy"
          break
        fi
        sleep 2
        ATTEMPTS_LEFT_TO_REACH_OPENSEARCH=$((ATTEMPTS_LEFT_TO_REACH_OPENSEARCH - 1))
      done
      if [ $ATTEMPTS_LEFT_TO_REACH_OPENSEARCH -eq 0 ]; then
        echo "OpenSearch is not ready after timeout"; exit 1
      fi
    # Wait for Valkey
    - |
      ATTEMPTS_LEFT_TO_REACH_VALKEY=30
      until [ $ATTEMPTS_LEFT_TO_REACH_VALKEY -eq 0 ] || redis-cli -h valkey ping 2>/dev/null | grep -q PONG; do
        sleep 1
        ATTEMPTS_LEFT_TO_REACH_VALKEY=$((ATTEMPTS_LEFT_TO_REACH_VALKEY - 1))
        echo "Waiting for Valkey... $ATTEMPTS_LEFT_TO_REACH_VALKEY attempts left."
      done
      if [ $ATTEMPTS_LEFT_TO_REACH_VALKEY -eq 0 ]; then
        echo "Valkey not ready"; exit 1
      fi
      echo "Valkey is ready"
    # Setup test environment (order: db → schema → cache)
    - php bin/console doctrine:database:create --if-not-exists --env=test
    - php bin/console doctrine:schema:create --no-interaction --env=test
    - php bin/console doctrine:migrations:sync-metadata-storage --no-interaction --env=test
    - php bin/console doctrine:migrations:version --add --all --no-interaction --env=test
    - php bin/console cache:clear --env=test
    - php bin/console cache:warmup --env=test
    - php bin/console opensearch:migrations:migrate --no-interaction --force --env=test
    - php -d memory_limit=2G bin/console doctrine:fixture:load --no-interaction --env=test
  script:
    - php -d memory_limit=2G vendor/bin/phpunit --testsuite "Integration tests" --no-coverage --log-junit=report-integration.xml
  artifacts:
    when: always
    reports:
      junit: apps/target/report-integration.xml

# ─── N8N Validation Stage ─────────────────────────────
target:n8n-validate:
  <<: *target-php-job
  stage: test
  needs: []
  script:
    - php tests/N8N/validate-n8n-workflows.php --workflows-dir=n8n/workflows --format=junit --output=n8n-validation.xml
  artifacts:
    when: always
    reports:
      junit: apps/target/n8n-validation.xml

target:n8n-validate-datasets:
  image: ${CI_REGISTRY}/chapsmind/ci-images/web-linters:latest
  stage: test
  needs: []
  <<: *target-changes
  script:
    - cd apps/target/n8n/tests
    - npm install --no-audit --no-fund
    - node validate-datasets.js
  artifacts:
    when: always

# ─── Publish (build + tag + push) ─────────────────────
target:publish:
  interruptible: false
  extends: .docker-publish
  needs:
    [
      target:cs-check,
      target:phpstan,
      target:test:unit,
      target:test:integration,
      target:n8n-validate,
      target:n8n-validate-datasets,
    ]
  variables:
    IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-target
    DOCKER_CONTEXT: apps/target

# ─── Trivy container scan ─────────────────────────────
target:trivy:
  extends: .trivy-scan
  needs: [target:publish]
  variables:
    SCAN_IMAGE: ${CI_REGISTRY_IMAGE}/chapsmind-target

# ─── OpenAPI Export ───────────────────────────────────
target:openapi-export:
  <<: *target-php-job
  stage: test
  needs: []
  script:
    - php bin/console api:openapi:export --output=openapi.json
    - php bin/console api:openapi:export --yaml --output=openapi.yaml
  artifacts:
    paths:
      - apps/target/openapi.json
      - apps/target/openapi.yaml
    expire_in: 30 days
