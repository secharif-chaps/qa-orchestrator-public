version: '3'

tasks:
  export-workflows:
    desc: 'Export n8n workflows from n8n instance to workflows directory with kebab-case naming'
    cmds:
      - python3 scripts/export-n8n-workflows.py
    summary: |
      Usage:
        task n8n:export-workflows              # Perform actual export
        task n8n:export-workflows -- --dry-run # Preview export operations

      Note: Requires n8n service to be running (docker compose up n8n)

  export-credentials:
    desc: 'Export n8n credentials from n8n instance to credentials directory with kebab-case naming'
    cmds:
      - python3 scripts/export-n8n-credentials.py
    summary: |
      Usage:
        task n8n:export-credentials              # Perform actual export
        task n8n:export-credentials -- --dry-run # Preview export operations

      Note: Requires n8n service to be running (docker compose up n8n)

  reset:
    desc: 'Reset n8n instance (data and database)'
    summary: |
      Note: This will delete all n8n data and database, use with caution!
    cmds:
      - docker compose down n8n n8n-import
      - docker volume rm --force "$(docker compose volumes --format '{{.Name}}' | grep n8n_data)"
      - docker compose exec db psql -U ${POSTGRES_USER:-postgres} -d n8n_db -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO ${N8N_DB_USER:-postgres};"
      - docker compose --profile target up -d --wait n8n
      - docker compose logs -n 45 n8n-import n8n

  test:setup:
    desc: 'Setup N8N test environment (install dependencies)'
    cmds:
      - docker compose exec n8n npm --prefix /tests install

  test:
    desc: 'Run N8N workflow tests with dataset, usage: task n8n:test -- <dataset-filename> [options]'
    cmds:
      - docker compose exec --workdir /tests n8n node /tests/test-workflow.js {{.CLI_ARGS}}
    summary: |
      Usage:
        task n8n:test -- my-dataset.json           # Auto-detect workflow ID from dataset
        task n8n:test -- my-dataset.json --verbose # Verbose output
        task n8n:test -- my-dataset.json --parallel # Run tests in parallel

      Note: Dataset file can be just the filename (looks in /tests/datasets/) or full path

  validate:
    desc: 'Validate N8N workflows (naming convention, agent config, feedback nodes)'
    cmds:
      - docker compose exec target php tests/N8N/validate-n8n-workflows.php --workflows-dir=n8n/workflows {{.CLI_ARGS}}
    summary: |
      Validates all N8N workflows against best practices:
        1. Naming Convention: Domain_Role_Action format (e.g., Folder_Agent_UpdateReferenceSubject)
        2. Agent Configuration: fallback model, retry, maxIterations < 30, error output connected
        3. Feedback Nodes: JSON with success, message (translated), context.execution.id

      Usage:
        task n8n:validate                                           # Console output only
        task n8n:validate -- --workflows-dir=custom/path            # Custom workflows directory

      Exit codes:
        0 - All validations passed
        1 - Validation errors found
        2 - Script error

  validate:datasets:
    desc: 'Validate test datasets against JSON Schema'
    cmds:
      - docker compose exec --workdir /tests n8n node /tests/validate-datasets.js {{.CLI_ARGS}}
    summary: |
      Validates test dataset files against the dataset-schema.json schema.
      Checks for:
        - Required fields (version, metadata, testCases)
        - Valid testCaseId format (TC-XXX)
        - Snapshot normalization config
        - Success check configuration
        - Input/output structure

      Usage:
        task n8n:validate:datasets                     # Validate all datasets
        task n8n:validate:datasets -- datasets/my-test.json # Validate specific file

      Exit codes:
        0 - All datasets valid
        1 - Validation errors found
