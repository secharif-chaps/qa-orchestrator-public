security:
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
  # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
  providers:
    app_user_provider:
      id: 'App\Infrastructure\User\Security\UserProvider'
  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    apify_webhook:
      pattern: ^/api/apify/webhook
      stateless: true
      custom_authenticator: 'App\Infrastructure\User\Security\ApifyWebhookAuthenticator'
    webhook:
      pattern: ^/api/webhook
      stateless: true
      custom_authenticator: 'App\Infrastructure\User\Security\WebhookTokenAuthenticator'
    internal:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      custom_authenticators:
        - App\Infrastructure\Organisation\Security\InternalJwtAuthenticator

  # Easy way to control access for large sections of your site
  # Note: Only the *first* access control that matches will be used
  access_control:
    - { path: ^/api/apify/webhook, roles: ROLE_APIFY_WEBHOOK }
    - { path: ^/api/webhook, roles: ROLE_WEBHOOK }
    - { path: ^/api/docs, roles: PUBLIC_ACCESS }
    - { path: ^/api/healthcheck, roles: PUBLIC_ACCESS }
    - { path: ^/api/logo, roles: PUBLIC_ACCESS }
    - { path: ^/api, roles: ROLE_USER }

when@test:
  security:
    firewalls:
      internal:
        custom_authenticators:
          - App\Infrastructure\User\Security\TestAuthenticator
          - App\Infrastructure\Organisation\Security\InternalJwtAuthenticator
