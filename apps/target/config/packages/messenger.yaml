framework:
  messenger:
    serializer:
      default_serializer: messenger.transport.symfony_serializer
      symfony_serializer:
        format: json
        context: {}
    # Send failed messages to this transport for later handling
    failure_transport: failed
    default_bus: command.bus
    buses:
      command.bus:
        middleware:
          - App\Infrastructure\Organisation\Messenger\TenantMiddleware
          - doctrine_ping_connection
          - doctrine_close_connection
          - doctrine_transaction
          - router_context

    transports:
      agent_commands:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          queues:
            agent_commands: ~
          exchange:
            name: agent_commands
      agent_responses:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          queues:
            agent_responses: ~
          exchange:
            name: agent_responses
      # https://symfony.com/doc/current/messenger.html#transport-configuration
      async_priority_high:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          queues:
            async_priority_high: ~
          exchange:
            name: async_priority_high
        retry_strategy:
          max_retries: 3
          delay: 1000
          multiplier: 2
          max_delay: 60000
      async_priority_low:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          queues:
            async_priority_low: ~
          exchange:
            name: async_priority_low
        retry_strategy:
          max_retries: 3
          delay: 1000
          multiplier: 2
          max_delay: 60000
      quality_processing:
        dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
        options:
          queues:
            quality_processing: ~
          exchange:
            name: quality_processing
        retry_strategy:
          max_retries: 3
          delay: 1000
          multiplier: 2
          max_delay: 60000
      failed: 'doctrine://default?queue_name=failed'
      sync: 'sync://'

    routing:
      'App\Application\Agent\TriggerAgent': agent_commands
      'App\Application\WatchFile\Actor\AddActorAction': async_priority_high
      'App\Application\WatchFile\Source\AddSourceAction': async_priority_high
      'Symfony\Component\Mailer\Messenger\SendEmailMessage': async_priority_high
      'App\Application\DocumentQuality\Message\ProcessDocumentQualityAction': quality_processing
      'App\Application\SyncActionInterface': sync
      '*': async_priority_low

#when@dev:
#  framework:
#    messenger:
#      routing:
#        '*': sync

when@test:
  framework:
    messenger:
      transports:
        # Using test:// protocol for zenstruck/messenger-test
        # See https://github.com/zenstruck/messenger-test
        async_priority_high: 'test://'
        async_priority_low: 'test://'
        agent_commands: 'test://'
        agent_responses: 'test://'
        quality_processing: 'test://'
        failed: 'test://'
      routing:
        # Route emails to sync transport in tests to avoid serialization verification in test:// transport
        'Symfony\Component\Mailer\Messenger\SendEmailMessage': sync
