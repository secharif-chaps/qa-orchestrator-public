framework:
  cache:
    # Unique name of your app: used to compute stable namespaces for cache keys.
    prefix_seed: '%env(CACHE_PREFIX_SEED)%'

    # Configure Valkey as the default cache (protocol-compatible with Redis)
    app: cache.adapter.redis
    default_redis_provider: '%env(VALKEY_DSN)%'

    # Define some cache pools if needed
    pools:
      # Workaround for Symfony PhpFilesAdapter bug: VarExporter wraps ParsedExpression
      # in a Closure but PhpFilesAdapter doesn't unwrap it, causing TypeError in
      # API Platform's ResourceAccessChecker::usesObjectVariable()
      cache.security_expression_language:
        adapter: cache.adapter.array

      # Default pool using Valkey
      cache.app.default:
        adapter: cache.adapter.redis
        provider: '%env(VALKEY_DSN)%'
        default_lifetime: '%env(int:CACHE_DEFAULT_LIFETIME)%' # Default: 1 hour in seconds

      # Mercure debounce pool - short-lived cache for deduplicating updates
      cache.mercure.debounce:
        adapter: cache.adapter.redis
        provider: '%env(VALKEY_DSN)%'
        default_lifetime: 30 # 30 seconds debounce window

      # Source duplicate detection cache stores normalized URLs per WatchFile+Type
      cache.source.duplicate:
        adapter: cache.adapter.redis
        provider: '%env(VALKEY_DSN)%'
        default_lifetime: 3600 # 1 hour


    # The "app" cache stores to the filesystem by default.
    # The data in this cache should persist between deploys.
    # Other options include:

    # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
    #app: cache.adapter.apcu

    # Namespaced pools use the above "app" backend by default
    #pools:
    #my.dedicated.cache: null
