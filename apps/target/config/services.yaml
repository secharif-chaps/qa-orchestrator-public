# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
  default_app_name: 'Target'
  default_app_version: '0.0.1'
  mercure.jwt.secret: '%env(string:MERCURE_JWT_SECRET)%'
  env(APP_ENCRYPT_KEY): ''
  env(OPENSEARCH_NUM_SHARDS): 1
  env(OPENSEARCH_NUM_REPLICAS): 0
  timeline_cache_ttl_default: 900
  env(WATCHFILE_EVENTS_MAX_LIMIT): 1000

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    bind:
      string $environment: '%kernel.environment%'
  # makes classes in src/ available to be used as services
  # this creates a service per class whose id is the fully-qualified class name

  _instanceof:
    App\Domain\Collect\CollectDataHandlerInterface:
      tags: ['collect_data_handler']
    App\Domain\DocumentQuality\DocumentProcessorInterface:
      tags: ['app.document_processor']

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Kernel.php'

  # add more service definitions when explicit configuration is needed
  # please note that last definitions always *replace* previous ones

  App\Domain\DocumentQuality\ScoringStrategyInterface:
    class: App\Domain\DocumentQuality\DefaultScoringStrategy

  # Document Processing Pipeline - processors sorted by #[AsTaggedItem(priority: X)] via Symfony DI
  App\Infrastructure\DocumentQuality\DocumentProcessingPipeline:
    arguments:
      $processors: !tagged_iterator app.document_processor

  # Logo Infrastructure Gateways
  App\Infrastructure\Logo\LogoDevGateway:
    arguments:
      $apiKey: '%env(string:LOGO_DEV_API_KEY)%'

  App\Infrastructure\Logo\GoogleFaviconGateway: ~

  # Logo Handler with ordered gateways (primary first, fallback second)
  App\Application\Logo\GetLogoHandler:
    arguments:
      $logoGateways:
        - '@App\Infrastructure\Logo\LogoDevGateway'
        - '@App\Infrastructure\Logo\GoogleFaviconGateway'

  # Timeline Cache Service
  App\Infrastructure\WatchFile\TimelineCacheService:
    arguments:
      $cache: '@cache.app'
      $cacheTtl: '%env(default:timeline_cache_ttl_default:int:TIMELINE_CACHE_TTL)%'

  # WatchFile Event OpenSearch Gateway
  App\Infrastructure\WatchFileEvent\WatchFileEventOpenSearchGateway:
    arguments:
      $maxEventsLimit: '%env(int:WATCHFILE_EVENTS_MAX_LIMIT)%'

  # Webhook Token Authentication
  App\Infrastructure\User\Security\WebhookTokenAuthenticator:
    factory: ['App\Infrastructure\User\Security\WebhookTokenAuthenticator', 'create']
    arguments:
      $sharedToken: '%env(string:WEBHOOK_SHARED_TOKEN)%'
      $secretKey: '%env(string:WEBHOOK_SECRET_KEY)%'
      $allowedIpsString: '%env(string:WEBHOOK_ALLOWED_IPS)%'

  # Internal JWT Authenticator (Global Service gateway)
  App\Infrastructure\Organisation\Security\InternalJwtAuthenticator:
    factory: ['App\Infrastructure\Organisation\Security\InternalJwtAuthenticator', 'create']
    arguments:
      $internalJwtSecret: '%env(string:INTERNAL_JWT_SECRET)%'
      $internalAllowedIps: '%env(string:INTERNAL_ALLOWED_IPS)%'

  App\Domain\Encryption\EncryptorInterface:
    class: App\Infrastructure\Encryption\Encryptor
    arguments:
      $secretKey: '%env(string:APP_ENCRYPT_KEY)%'

  App\Infrastructure\OpenSearch\Migration\OpenSearchMigrationFinder:
    arguments:
      $openSearchMigrationDirectory: '%kernel.project_dir%/migrations/opensearch/'

  # Ensure built-in normalizers run before API Platform's ItemNormalizer (-890) (Symfony 7.4 compat)
  serializer.normalizer.datetime:
    class: Symfony\Component\Serializer\Normalizer\DateTimeNormalizer
    tags: [{ name: 'serializer.normalizer', priority: -880 }]
  serializer.normalizer.datetimezone:
    class: Symfony\Component\Serializer\Normalizer\DateTimeZoneNormalizer
    tags: [{ name: 'serializer.normalizer', priority: -880 }]
  serializer.normalizer.backed_enum:
    class: Symfony\Component\Serializer\Normalizer\BackedEnumNormalizer
    tags: [{ name: 'serializer.normalizer', priority: -880 }]

  # Serializer
  App\Infrastructure\Serializer\WatchFileEventAggregationsNormalizer:
    tags: [{ name: 'serializer.normalizer', priority: 75 }]
  App\Infrastructure\Serializer\WatchFileEventCollectionNormalizer:
    tags: [{ name: 'serializer.normalizer', priority: 70 }]
  App\Infrastructure\Serializer\DocumentCollectionNormalizer:
    tags: [{ name: 'serializer.normalizer', priority: 64 }]
  # Message normalizer for optimized chat performance (TAR-233)
  App\Infrastructure\Serializer\MessageNormalizer:
    tags: [{ name: 'serializer.normalizer', priority: 66 }]

  # Mercure Update Publisher with debounce cache (TAR-790)
  App\Infrastructure\Mercure\MercureUpdatePublisher:
    arguments:
      $mercureDebounceCache: '@cache.mercure.debounce'

  # Source Duplicate Cache - Valkey-based duplicate detection
  App\Infrastructure\Source\SourceDuplicateCache:
    arguments:
      $cache: '@cache.source.duplicate'

  App\Application\Chat\ErrorModelMessageHandler:
    arguments:
      $timeoutSeconds: '%env(int:AGENT_EXECUTION_TIMEOUT_SECONDS)%'

  # API Platform URI Variable Transformer (fix for missing ApiResourceUriVariableTransformer in v4.2.11)
  api_platform.uri_variables.transformer.api_resource:
    class: App\Infrastructure\ApiPlatform\ApiResourceUriVariableTransformer
    arguments:
      $resourceClassResolver: '@api_platform.resource_class_resolver'
    tags: [{ name: 'api_platform.uri_variables.transformer', priority: -100 }]
