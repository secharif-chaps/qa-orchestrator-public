parameters:
  env(BAKUS_CLIENT_ID): ''
  env(BAKUS_CLIENT_SECRET): ''
  env(BAKUS_USERNAME): ''
  env(BAKUS_PASSWORD): ''
  env(BAKUS_AUTH_URL): ''
  env(BAKUS_API_URL): ''
  env(BAKUS_WEBSOCKET_URL): ''
  env(BAKUS_CALLBACK_TYPE): 'websocket_pull'
  env(BAKUS_CALLBACK_VERIFY_SSL): 'true'
  env(BAKUS_CALLBACK_URL): ''
  env(BAKUS_CALLBACK_PROXY_TAGS): 'target-ws'
  env(BAKUS_WEBSOCKET_SERVER_PORT): '5000'
  env(BAKUS_WEBSOCKET_SERVER_SSL_ENABLED): 'true'
  env(BAKUS_WEBSOCKET_SERVER_SSL_CERT): '/certs/basil.local-cert.pem'
  env(BAKUS_WEBSOCKET_SERVER_SSL_KEY): '/certs/basil.local-key.pem'
  env(BAKUS_WEBSOCKET_SERVER_SSL_ALLOW_SELF_SIGNED): 'true'
  env(BAKUS_WEBSOCKET_SERVER_SSL_VERIFY_PEER): 'false'
  env(BAKUS_WEBSOCKET_SERVER_SSL_VERIFY_PEER_NAME): 'false'
  env(BAKUS_WEBSOCKET_SERVER_SSL_CA_CERT): ''
  env(BAKUS_WEBSOCKET_MAX_CONNECTIONS): '100'
  env(BAKUS_WEBSOCKET_TIMEOUT): '25'
  env(COLLECT_TASK_JWT_SECRET): ''
  env(COLLECT_DEFAULT_PROVIDER): 'bakus'

  env(APIFY_API_URL): 'https://api.apify.com'
  env(APIFY_API_TOKEN): ''
  env(APIFY_MAX_TOTAL_CHARGE_USD): '0.10'
  env(APIFY_WEBHOOK_URL): ''

  app.apify.webhook_url: '%env(string:APIFY_WEBHOOK_URL)%'
  app.apify.max_total_charge_usd: '%env(string:APIFY_MAX_TOTAL_CHARGE_USD)%'

  # Maps SourceType values to Apify actor IDs (lot initial — Phase 1).
  app.apify.actor_mapping:
    social_media:linkedin:user: 'curious_coder/linkedin-profile-scraper'
    social_media:linkedin:company: 'bebity/linkedin-premium-actor'
    social_media:instagram:user: 'apify/instagram-scraper'
    social_media:instagram:hashtag: 'apify/instagram-scraper'
    social_media:instagram:search: 'apify/instagram-scraper'
    social_media:x:user: 'apidojo/tweet-scraper'
    social_media:x:search: 'apidojo/tweet-scraper'
    social_media:x:hashtag: 'apidojo/tweet-scraper'
    social_media:facebook:page: 'apify/facebook-posts-scraper'
    social_media:facebook:user: 'apify/facebook-posts-scraper'
    social_media:facebook:group: 'apify/facebook-posts-scraper'
    social_media:facebook:search: 'apify/facebook-posts-scraper'
    social_media:facebook:ads: 'apify/facebook-ads-scraper'
    social_media:tiktok: 'clockworks/tiktok-scraper'
    video:youtube:channel: 'streamers/youtube-scraper'
    video:youtube:playlist: 'streamers/youtube-scraper'
    video:youtube:search: 'streamers/youtube-scraper'
    video:youtube:comments: 'streamers/youtube-comments-scraper'
    news:newsapi: 'lhotanova/google-news-scraper'
    news:newsapi:headlines: 'lhotanova/google-news-scraper'
    website: 'apify/website-content-crawler'
    blog: 'apify/website-content-crawler'

  # Input templates for Apify actors — Phase 1 (website, news, linkedin)
  app.apify.input_templates:
    # Website crawler (website, blog)
    apify/website-content-crawler:
      name: 'Website Crawler'
      source_types: ['website', 'blog']
      defaults:
        startUrls:
          - '{{source.url}}'
        maxCrawlPages: '{{config.maxCrawlPages|default:50}}'
        maxCrawlDepth: '{{config.maxCrawlDepth|default:2}}'
        crawlerType: 'cheerio'
        saveMarkdown: true
        proxyConfiguration:
          useApifyProxy: true
      required_fields: ['startUrls']

    # Google News scraper (news:newsapi, news:newsapi:headlines)
    lhotanova/google-news-scraper:
      name: 'Google News Scraper'
      source_types: ['news:newsapi', 'news:newsapi:headlines']
      defaults:
        keywords:
          - '{{source.query}}'
        maxArticles: '{{config.maxArticles|default:50}}'
        timeframe: '{{config.timeframe|default:24h}}'
        region_language: '{{config.region|default:FR:fr}}'
        extractDescriptions: true
      required_fields: ['keywords']

    # LinkedIn profile scraper (social_media:linkedin:user)
    curious_coder/linkedin-profile-scraper:
      name: 'LinkedIn Profile Scraper'
      source_types: ['social_media:linkedin:user']
      defaults:
        profileUrls:
          - '{{source.url}}'
        proxyConfiguration:
          useApifyProxy: true
          apifyProxyGroups:
            - 'RESIDENTIAL'
      required_fields: ['profileUrls']

    # Twitter/X Tweet Scraper (social_media:x:user, social_media:x:search, social_media:x:hashtag)
    apidojo/tweet-scraper:
      name: 'Twitter/X Tweet Scraper V2'
      source_types: ['social_media:x:user', 'social_media:x:search', 'social_media:x:hashtag']
      defaults:
        searchTerms:
          - '{{source.query}}'
        maxTweets: '{{config.max_tweets|default:100}}'
        language: '{{config.language|default:fr}}'
        addUserInfo: true
        proxyConfiguration:
          useApifyProxy: true
      required_fields: ['searchTerms']

    # TikTok Scraper (social_media:tiktok)
    clockworks/tiktok-scraper:
      name: 'TikTok Scraper'
      source_types: ['social_media:tiktok']
      max_total_charge_usd: '0.50'   # actor minimum is $0.50 (pay-per-event pricing)
      defaults:
        profiles:
          - '{{source.query}}'
        resultsPerPage: '{{config.max_results|default:50}}'
        shouldDownloadVideos: false
        proxyConfiguration:
          useApifyProxy: true
      required_fields: ['profiles']

    # YouTube Scraper — channels & playlists (url-based)
    # video:youtube:search uses searchQueries instead of startUrls
    streamers/youtube-scraper:
      name: 'YouTube Scraper'
      source_types: ['video:youtube:channel', 'video:youtube:playlist', 'video:youtube:search']
      max_total_charge_usd: '5.00'   # ~$5.00/1K videos (pay-per-result pricing)
      defaults:
        startUrls:
          - '{{source.url}}'
        searchQueries:               # used when source has a query instead of a URL (video:youtube:search)
          - '{{source.query}}'
        maxResults: '{{config.maxResults|default:50}}'
        proxyConfiguration:
          useApifyProxy: true
      required_fields: []            # url OR query is sufficient — actor accepts either

    # YouTube Comments Scraper (video:youtube:comments)
    streamers/youtube-comments-scraper:
      name: 'YouTube Comments Scraper'
      source_types: ['video:youtube:comments']
      max_total_charge_usd: '1.00'   # pay-per-usage — à calibrer selon le volume réel
      defaults:
        videoUrls:
          - '{{source.url}}'
        maxComments: '{{config.maxComments|default:100}}'
        proxyConfiguration:
          useApifyProxy: true
      required_fields: ['videoUrls']
    # Facebook Posts Scraper (social_media:facebook:page, user, group, search)
    apify/facebook-posts-scraper:
      name: 'Facebook Posts Scraper'
      source_types: ['social_media:facebook:page', 'social_media:facebook:user', 'social_media:facebook:group', 'social_media:facebook:search']
      defaults:
        startUrls:
          - url: '{{source.url}}'
        maxPosts: 100
        proxyConfiguration:
          useApifyProxy: true
      required_fields: ['startUrls']

    # Facebook Ads Scraper / Meta Ad Library (social_media:facebook:ads)
    apify/facebook-ads-scraper:
      name: 'Facebook Ads Scraper'
      source_types: ['social_media:facebook:ads']
      defaults:
        searchTerms:
          - '{{source.query}}'
        maxResults: '{{config.max_results|default:100}}'
        countries:
          - '{{config.country|default:FR}}'
        proxyConfiguration:
          useApifyProxy: true
      required_fields: ['searchTerms']

  app.collect_task.jwt_secret: '%env(string:COLLECT_TASK_JWT_SECRET)%'

  app.collect.provider_routing.default: '%env(string:COLLECT_DEFAULT_PROVIDER)%'

  # Routes SourceTypes to a specific provider, overriding the default (bakus).
  app.collect.provider_routing.source_types:
    social_media:linkedin:user: 'apify'
    social_media:linkedin:company: 'apify'
    social_media:instagram:user: 'apify'
    social_media:instagram:hashtag: 'apify'
    social_media:instagram:search: 'apify'
    social_media:x:user: 'apify'
    social_media:x:search: 'apify'
    social_media:x:hashtag: 'apify'
    social_media:facebook:page: 'apify'
    social_media:facebook:user: 'apify'
    social_media:facebook:group: 'apify'
    social_media:facebook:search: 'apify'
    social_media:facebook:ads: 'apify'
    social_media:tiktok: 'apify'
    news:newsapi: 'apify'
    news:newsapi:headlines: 'apify'
    website: 'apify'
    blog: 'apify'
    # Manual single-URL / pasted-content ingestion goes through the inline
    # web provider (HtmlFetcher + HtmlMetadataExtractor + DocumentBuilder).
    manual: 'web'
    video:youtube:channel: 'apify'
    video:youtube:playlist: 'apify'
    video:youtube:search: 'apify'
    video:youtube:comments: 'apify'

  app.bakus.callback_type: '%env(string:BAKUS_CALLBACK_TYPE)%'
  app.bakus.callback_url: '%env(string:BAKUS_CALLBACK_URL)%'
  app.bakus.callback_verify_ssl: '%env(bool:BAKUS_CALLBACK_VERIFY_SSL)%'
  app.bakus.callback_proxy_tags: '%env(csv:BAKUS_CALLBACK_PROXY_TAGS)%'

  app.bakus.collector_mapping:
    # Dailymotion
    get_user_videos.dailymotion.sbx: ['video:dailymotion:user']
    get_video.dailymotion.sbx: ['video:dailymotion:video']
    search_channels.dailymotion.sbx: ['video:dailymotion:channel:search']
    search_videos.dailymotion.sbx: ['video:dailymotion:search']

    # Domains
    company_name.nrd_search.psql.blackmorf: ['domain:company_name']
    content_str.domain_name_details.psql.blackmorf: ['domain:search']
    content_str.new_domain_names_nrd.psql.blackmorf: ['domain:search']
    content_str.certstream_fqdns_and_domains_recent.psql.blackmorf: ['domain:search']

    # Espacenet
    get_patents_advanced_search.espacenet.sbx: ['document:espacenet:advanced_search']
    get_patents_smart_search.espacenet.sbx: ['document:espacenet:smart_search']

    # Facebook
    get_posts_from_page.facebook.sbx: ['social_media:facebook:page']
    search_pages.facebook.sbx: ['social_media:facebook:search']

    # FTP
    get_files.ftp.sbx: ['file:ftp']

    # Gab
    get_group_posts.gab.sbx: ['social_media:gab:group']
    get_user_posts.gab.sbx: ['social_media:gab:user']
    search_posts.gab.sbx: ['social_media:gab:search']
    search_users.gab.sbx: ['social_media:gab:user:search']

    # IEEE Xplore
    get_publications.ieeexplore.sbx: ['document:ieeexplore:publications']

    # Mastodon
    get_user_posts.mastodon.sbx: ['social_media:mastodon:user']
    search_users.mastodon.sbx: ['social_media:mastodon:search']

    # NewsAPI
    get_news.newsapi.sbx: ['news:newsapi']
    get_headlines.newsapi.sbx: ['news:newsapi:headlines']

    # Odysee
    get_videos.odysee.sbx: ['video:odysee']
    search_channels.odysee.sbx: ['video:odysee:channel:search']

    # Pages
    get_pages.site.sbx: ['rss_feed', 'website', 'blog']

    # Questel
    search_documents.questel.sbx: ['document:questel:search']

    # Reddit
    get_posts_from_sr.reddit.sbx: ['social_media:reddit:subreddit']
    get_posts_from_user.reddit.sbx: ['social_media:reddit:user']
    get_profile_info_sr.reddit.sbx: ['social_media:reddit:subreddit']
    get_profile_info_user.reddit.sbx: ['social_media:reddit:user']

    # SerpAPI
    baidu.serpapi.blackmorf: ['search:baidu']
    bing.serpapi.blackmorf: ['search:bing']
    google.serpapi.blackmorf: ['search:google']
    google_images.serpapi.blackmorf: ['image:google:images']
    yahoo.serpapi.blackmorf: ['search:yahoo']
    yandex.serpapi.blackmorf: ['search:yandex']

    # Telegram
    get_channel_infos.telegram.sbx: ['social_media:telegram:channel']
    get_channel_posts.telegram.sbx: ['social_media:telegram:channel']

    # Twitter/X (Nitter)
    get_tweets.twitter.sbx: ['social_media:x:user']
    search_users.twitter.sbx: ['social_media:x:search']

    # Zone Events
    get_zone_events.geoconfirmed.sbx: ['event:geoconfirmed:zone']

  app.bakus.collector_default_parameters:
    rss.bakus:
      recursive_request_content: true
    get_pages.site.sbx:
      depth: 1
      attachments: separated
      return_query_logs: true

services:
  # default configuration for services in *this* file
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  app.collect_provider.bakus_credentials:
    class: App\Domain\Collect\Auth\AuthenticationCredentials
    arguments:
      $clientId: '%env(string:BAKUS_CLIENT_ID)%'
      $clientSecret: '%env(string:BAKUS_CLIENT_SECRET)%'
      $username: '%env(string:BAKUS_USERNAME)%'
      $password: '%env(string:BAKUS_PASSWORD)%'
      $authUrl: '%env(string:BAKUS_AUTH_URL)%'

  App\Domain\Collect\Auth\AuthenticationClientInterface:
    alias: App\Infrastructure\Collect\Bakus\Auth\BakusAuthenticationClient

  App\Infrastructure\Collect\Bakus\Auth\BakusAuthenticationClient:
    arguments:
      $credentials: '@app.collect_provider.bakus_credentials'

  app.collect_provider.bakus_websocket_client.middleware.close_handler:
    class: WebSocket\Middleware\CloseHandler
    tags: ['app.collect_provider.bakus_websocket_client.middleware']
    calls:
      - ['setLogger', ['@logger']]

  app.collect_provider.bakus_websocket_client.middleware.ping_responder:
    class: WebSocket\Middleware\PingResponder
    tags: ['app.collect_provider.bakus_websocket_client.middleware']
    calls:
      - ['setLogger', ['@logger']]

  app.collect_provider.bakus_websocket_client.middleware.ping_interval:
    class: WebSocket\Middleware\PingInterval
    tags: ['app.collect_provider.bakus_websocket_client.middleware']
    calls:
      - ['setLogger', ['@logger']]
    arguments:
      - 20

  app.collect_provider.bakus_websocket_client_factory:
    class: App\Infrastructure\Collect\Bakus\Stream\WebSocketClientFactory
    arguments:
      - '%env(string:BAKUS_WEBSOCKET_URL)%'
    calls:
      - ['setTimeout', ['%env(int:BAKUS_WEBSOCKET_TIMEOUT)%']]
      - ['setLogger', ['@logger']]
      - [
          'addHeader',
          [
            'User-Agent',
            '%env(default:default_app_name:string:APP_NAME)%/%env(default:default_app_version:string:APP_VERSION)%',
          ],
        ]
      - [
          'addMiddlewares',
          [!tagged_iterator { tag: 'app.collect_provider.bakus_websocket_client.middleware' }],
        ]

  App\Infrastructure\Collect\Bakus\Client\BakusHttpClient:
    arguments:
      $apiUrl: '%env(string:BAKUS_API_URL)%'

  App\Infrastructure\Collect\Bakus\Stream\BakusWebSocketClient:
    arguments:
      $websocketUrl: '%env(string:BAKUS_WEBSOCKET_URL)%'
      $clientFactory: '@app.collect_provider.bakus_websocket_client_factory'

  App\Infrastructure\Collect\Bakus\Stream\Middleware\CollectTaskAuthorizationMiddleware:

  App\Infrastructure\Collect\Bakus\BakusProviderGateway:
    tags:
      - { name: 'app.collect.provider', key: 'bakus' }

  App\Infrastructure\Collect\Apify\ApifyProviderGateway:
    tags:
      - { name: 'app.collect.provider', key: 'apify' }

  App\Infrastructure\Collect\Web\WebProviderGateway:
    tags:
      - { name: 'app.collect.provider', key: 'web' }

  # Default autowire targets for the Collect interfaces. Services that need
  # a specific provider must use ProviderGatewayLocator instead.
  App\Domain\Collect\ProviderGatewayInterface:
    alias: App\Infrastructure\Collect\Bakus\BakusProviderGateway

  App\Domain\Collect\StatusMapperInterface:
    alias: App\Infrastructure\Collect\Bakus\BakusStatusMapper

  App\Infrastructure\Collect\ProviderGatewayLocator:
    arguments:
      - !tagged_locator { tag: 'app.collect.provider', index_by: 'key' }

  App\Domain\Collect\ProviderResolverInterface:
    class: App\Infrastructure\Collect\SourceTypeProviderResolver

  App\Domain\Collect\Url\UrlSourceTypeClassifierInterface:
    class: App\Infrastructure\Collect\Url\HostBasedUrlSourceTypeClassifier

  App\Domain\Url\UrlSanitizerInterface:
    class: App\Infrastructure\Url\PhpUrlSanitizer

  app.collect_provider.websocket_server_ssl_context:
    class: Phrity\Net\Context
    calls:
      - [
          'setOptions',
          [
            {
              ssl:
                {
                  local_cert: '%env(string:BAKUS_WEBSOCKET_SERVER_SSL_CERT)%',
                  local_pk: '%env(string:BAKUS_WEBSOCKET_SERVER_SSL_KEY)%',
                  cafile: '%env(string:BAKUS_WEBSOCKET_SERVER_SSL_CA_CERT)%',
                  allow_self_signed: '%env(bool:BAKUS_WEBSOCKET_SERVER_SSL_ALLOW_SELF_SIGNED)%',
                  verify_peer: '%env(bool:BAKUS_WEBSOCKET_SERVER_SSL_VERIFY_PEER)%',
                  verify_peer_name: '%env(bool:BAKUS_WEBSOCKET_SERVER_SSL_VERIFY_PEER_NAME)%',
                },
            },
          ],
        ]

  WebSocket\Server:
    arguments:
      $port: '%env(int:BAKUS_WEBSOCKET_SERVER_PORT)%'
      $ssl: '%env(bool:BAKUS_WEBSOCKET_SERVER_SSL_ENABLED)%'
    calls:
      - ['setTimeout', ['%env(int:BAKUS_WEBSOCKET_TIMEOUT)%']]
      - ['setMaxConnections', ['%env(int:BAKUS_WEBSOCKET_MAX_CONNECTIONS)%']]
      - ['setContext', ['@app.collect_provider.websocket_server_ssl_context']]
      - ['addMiddleware', ['@app.collect_provider.bakus_websocket_client.middleware.close_handler']]
      - [
          'addMiddleware',
          ['@app.collect_provider.bakus_websocket_client.middleware.ping_responder'],
        ]
      - ['addMiddleware', ['@app.collect_provider.bakus_websocket_client.middleware.ping_interval']]
      - [
          'addMiddleware',
          [
            '@App\Infrastructure\Collect\Bakus\Stream\Middleware\CollectTaskAuthorizationMiddleware',
          ],
        ]
