parameters:
  usage_limits:
    watchfile:
      max_owned_non_archived: 100
      max_active_per_user: 2
    source:
      max_per_watchfile: 100
      max_active_per_watchfile:
        limit: 20
        inclusive: true
    actor:
      max_per_watchfile: 75
    document:
      max_per_watchfile:
        limit: 1000
        inclusive: true

services:
  App\Infrastructure\UsageLimit\Config\UsageLimitConfig:
    arguments:
      $limits: '%usage_limits%'
