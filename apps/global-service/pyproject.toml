[tool.poetry]
name = "global-service"
version = "0.1.0"
description = "Chapsmind Global Service"
authors = ["Your Name <your.email@example.com>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
sqlalchemy = "^2.0.45"
psycopg2-binary = "^2.9.11"
asyncpg = "^0.30.0"
pydantic-settings = "^2.12.0"
pydantic = "^2.12.5"
email-validator = "^2.0.0"
alembic = "^1.17.2"
grpcio = "^1.76.0"
grpcio-tools = "^1.76.0"
grpcio-reflection = "^1.76.0"
fastapi-keycloak = "^1.1.1"
cachetools = "^6.2.4"
httpx = "^0.28.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pyjwt = "^2.8.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.0"
aiosqlite = "^0.20.0"
mypy = "^1.15"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["app/grpc_generated/", "tests/"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require running services)",
]
# Skip integration tests by default (run with: pytest --run-integration)
addopts = "-m 'not integration' --cov=app --cov-report=term-missing --cov-fail-under=40"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["app/grpc_generated/*"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # bugbear (common pitfalls)
    "SIM",   # simplify (code simplification)
    "ASYNC", # async best practices
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function call in default argument (FastAPI Depends pattern)
    "B904",    # raise without from (needs manual review for proper exception chaining)
    "SIM102",  # nested if statements (style preference)
    "SIM105",  # use contextlib.suppress (style preference)
    "SIM108",  # use ternary operator (style preference)
    "ASYNC210",# blocking HTTP in async (needs httpx migration)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
