version: '3'

vars:
  COMPOSE: docker compose

tasks:
  lint:
    desc: Lint backend code (ruff)
    cmd: "{{.COMPOSE}} exec global-service ruff check . {{.CLI_ARGS}}"

  format:
    desc: Format backend code (ruff)
    cmd: "{{.COMPOSE}} exec global-service ruff format ."

  test:
    desc: Run backend tests
    cmd: "{{.COMPOSE}} exec global-service pytest"

  mypy:
    desc: Run mypy type checking on backend code
    cmd: "{{.COMPOSE}} exec global-service mypy app/ --ignore-missing-imports"

  shell:
    desc: Open bash shell in global-service backend container
    cmd: "{{.COMPOSE}} exec global-service bash"
