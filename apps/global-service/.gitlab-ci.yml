# Global Service GitLab CI/CD Pipeline
# Lints, tests, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

# ─── Reusable blocks ───────────────────────────────────
# Run all jobs on any branch (not just when files change)
.gs-changes: &gs-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Lint Stage ────────────────────────────────────────
global-service:poetry-check:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/global-service && poetry check && poetry check --lock
  <<: *gs-changes

global-service:lint:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/global-service && ruff check app/ --exclude "app/grpc_generated/*"
  <<: *gs-changes

global-service:logger-extra-check:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/global-service/**/*.py
        - .gitlab/scripts/check-logger-extra.py
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/global-service/**/*.py
        - .gitlab/scripts/check-logger-extra.py
  script:
    - python3 .gitlab/scripts/check-logger-extra.py apps/global-service

global-service:alembic-check:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/global-service/alembic/versions/**/*
        - .gitlab/scripts/check-alembic.sh
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/global-service/alembic/versions/**/*
        - .gitlab/scripts/check-alembic.sh
  before_script:
    - cd apps/global-service
    - poetry config virtualenvs.create false && poetry install --no-interaction --no-root
  script:
    - cd $CI_PROJECT_DIR && .gitlab/scripts/check-alembic.sh apps/global-service

global-service:mypy:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  before_script:
    - cd apps/global-service
    - poetry config virtualenvs.create false && poetry install --no-interaction
  script:
    - mypy app/ --ignore-missing-imports --exclude "app/grpc_generated/*"
  allow_failure: true
  <<: *gs-changes

global-service:poetry-audit:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/global-service && poetry audit --ignore-package=ecdsa
  <<: *gs-changes

# ─── Test Stage ────────────────────────────────────────

# Shared test setup
.gs-test-base: &gs-test-base
  stage: test
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  before_script:
    - cd apps/global-service
    - poetry config virtualenvs.create false && poetry install --no-interaction
    - python scripts/generate_protos.py
  <<: *gs-changes

# Unit tests — fast, no external dependencies, must pass
global-service:test:unit:
  <<: *gs-test-base
  needs: []
  script:
    - pytest tests/unit/ tests/grpc/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=40 --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/global-service/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/global-service/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'

# Integration tests — require Postgres (row-level locking, real schema behavior)
global-service:test:integration:
  <<: *gs-test-base
  needs: []
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: chapsmind_db_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/chapsmind_db_test"
  before_script:
    - cd apps/global-service
    - poetry config virtualenvs.create false && poetry install --no-interaction
    - python scripts/generate_protos.py
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - until pg_isready -h postgres -U postgres -p 5432; do sleep 1; done
    - psql "$TEST_DATABASE_URL" -c 'CREATE SCHEMA IF NOT EXISTS global_schema'
  script:
    - pytest tests/integration/ -v --run-integration --no-cov --junitxml=report-integration.xml -m integration
  artifacts:
    when: always
    reports:
      junit: apps/global-service/report-integration.xml

# ─── Bandit — Python security analysis ───────────────
global-service:bandit:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  variables:
    BANDIT_SKIPS: B104,B105,B106,B110,B112,B311
  script:
    - cd apps/global-service
    - pip install -q bandit==1.8.3
    - bandit -r app/ --skip ${BANDIT_SKIPS} --exclude app/grpc_generated -f json -o bandit-report.json || BANDIT_RC=$?
    - bandit -r app/ --skip ${BANDIT_SKIPS} --exclude app/grpc_generated || true
    - exit ${BANDIT_RC:-0}
  artifacts:
    paths:
      - apps/global-service/bandit-report.json
    when: always
    expire_in: 7 days
  <<: *gs-changes

# ─── Publish (build + tag + push) ─────────────────────
global-service:publish:
  interruptible: false
  extends: .docker-publish
  needs: [global-service:lint, global-service:poetry-check, global-service:poetry-audit, global-service:test:unit, global-service:test:integration]
  variables:
    IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-global-service
    DOCKER_CONTEXT: apps/global-service

# ─── Scan Stage (Trivy) ──────────────────────────────
global-service:trivy:
  extends: .trivy-scan
  needs: [global-service:publish]
  variables:
    SCAN_IMAGE: ${CI_REGISTRY_IMAGE}/chapsmind-global-service
