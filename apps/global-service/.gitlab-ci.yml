# Global Service GitLab CI/CD Pipeline
# Builds and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/global-service
  IMAGE_TAG: preprod
  DOCKER_BUILDKIT: 1

# ---- Rules ----

.gs-rules: &gs-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/global-service/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/global-service/**/*

# ---- CodingStandards Stage ----

gs:lint:
  stage: CodingStandards
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - cd apps/global-service && ruff check app/ --exclude "app/grpc_generated/*"
  <<: *gs-rules

gs:test:
  stage: CodingStandards
  image: python:3.12-slim
  before_script:
    - pip install poetry
    - cd apps/global-service && poetry config virtualenvs.create false && poetry install --no-interaction
    - cd apps/global-service && python scripts/generate_protos.py
  script:
    - cd apps/global-service && pytest tests/ -v --cov=app --cov-report=term-missing
  <<: *gs-rules

# ---- Build template ----

.build:
  image: docker:cli
  script:
    - echo Building $IMAGE_NAME:$IMAGE_TAG
    - docker build --no-cache --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/global-service/

# ---- Build Stage ----

gs:build:
  stage: Build
  extends: .build
  <<: *gs-rules

# ---- Publish Stage ----

gs:publish:
  stage: Publish
  extends: .build
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push $IMAGE_NAME:${IMAGE_TAG}
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/global-service/**/*
