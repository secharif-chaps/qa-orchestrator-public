# Global Service GitLab CI/CD Pipeline
# Lints, tests, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-global-service
  DOCKER_BUILDKIT: 1

# ─── Reusable blocks ───────────────────────────────────
# Run all jobs on any branch (not just when files change)
.gs-changes: &gs-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Lint Stage ────────────────────────────────────────
global-service:lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - cd apps/global-service && ruff check app/ --exclude "app/grpc_generated/*"
  <<: *gs-changes

# ─── Test Stage ────────────────────────────────────────
global-service:test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install poetry
    - cd apps/global-service
    - poetry config virtualenvs.create false && poetry install --no-interaction
    - python scripts/generate_protos.py
  script:
    - pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/global-service/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/global-service/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  <<: *gs-changes

# ─── Build Stage (Docker) ─────────────────────────────
.gs-docker-build:
  image: docker:29-cli
  script:
    - echo "Building $IMAGE_NAME:${IMAGE_TAG}"
    - docker build --no-cache --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/global-service/

# Build test (don't push) - runs on all branches
global-service:docker-build:
  stage: build
  extends: .gs-docker-build
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Main branch: build + push with SHA tag and :latest
# DISABLED: Do not publish on this test branch
global-service:publish:
  stage: publish
  extends: .gs-docker-build
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_NAME}:latest"
    - docker push "${IMAGE_NAME}:latest"
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
