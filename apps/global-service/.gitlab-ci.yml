# Global Service GitLab CI/CD Pipeline
# Builds and publishes Docker image to GitLab Container Registry on main branch

stages:
  - lint
  - test
  - build
  - publish

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/global-service
  IMAGE_TAG: preprod
  DOCKER_BUILDKIT: 1

# ---- Rules ----

.default-rules: &default-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/global-service/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/global-service/**/*

# ---- Lint Stage ----

lint:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install ruff
  script:
    - cd apps/global-service && ruff check app/ --exclude "app/grpc_generated/*"
  <<: *default-rules

# ---- Test Stage ----

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install poetry
    - cd apps/global-service && poetry config virtualenvs.create false && poetry install --no-interaction
    - cd apps/global-service && python scripts/generate_protos.py
  script:
    - cd apps/global-service && pytest tests/ -v --cov=app --cov-report=term-missing
  <<: *default-rules

# ---- Build template ----

.build:
  image: docker:29-cli
  script:
    - echo Building $IMAGE_NAME:$IMAGE_TAG
    - docker build --no-cache --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/global-service/

# ---- Build Stage ----

build:
  stage: build
  extends: .build
  <<: *default-rules

# ---- Publish Stage ----

publish:
  stage: publish
  extends: .build
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push $IMAGE_NAME:${IMAGE_TAG}
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/global-service/**/*