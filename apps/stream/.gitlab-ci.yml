# Stream Service GitLab CI/CD Pipeline
# Lints, tests, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

# ─── Reusable blocks ───────────────────────────────────
# Run all jobs on any branch (not just when files change)
.stream-changes: &stream-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ─── Lint Stage ────────────────────────────────────────
stream:poetry-check:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/stream && poetry check && poetry check --lock
  <<: *stream-changes

stream:lint:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/stream && ruff check app/
  <<: *stream-changes

stream:mypy:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/stream
    - poetry config virtualenvs.create false && poetry install --no-interaction
    - mypy app/ --ignore-missing-imports
  <<: *stream-changes

stream:poetry-audit:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - cd apps/stream && poetry audit --ignore-package=ecdsa
  <<: *stream-changes

# ─── Test Stage ────────────────────────────────────────
stream:test:
  stage: test
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  before_script:
    - cd apps/stream
    - poetry config virtualenvs.create false && poetry install --no-interaction
  script:
    - pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: apps/stream/report.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/stream/coverage.xml
  coverage: '/TOTAL.*\s+(\d+%)/'
  <<: *stream-changes

# ─── Bandit — Python security analysis ───────────────
stream:bandit:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  variables:
    BANDIT_SKIPS: B104,B105,B106,B110,B112,B311
  script:
    - cd apps/stream
    - pip install -q bandit==1.8.3
    - bandit -r app/ --skip ${BANDIT_SKIPS} -f json -o bandit-report.json || BANDIT_RC=$?
    - bandit -r app/ --skip ${BANDIT_SKIPS} || true
    - exit ${BANDIT_RC:-0}
  artifacts:
    paths:
      - apps/stream/bandit-report.json
    when: always
    expire_in: 7 days
  <<: *stream-changes

# ─── Publish (build + tag + push) ─────────────────────
stream:publish:
  extends: .docker-publish
  needs: [stream:lint, stream:mypy, stream:poetry-check, stream:poetry-audit, stream:test]
  variables:
    IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-stream
    DOCKER_CONTEXT: apps/stream

# ─── Scan Stage (Trivy) ──────────────────────────────
stream:trivy:
  extends: .trivy-scan
  needs: [stream:publish]
  variables:
    SCAN_IMAGE: ${CI_REGISTRY_IMAGE}/chapsmind-stream
