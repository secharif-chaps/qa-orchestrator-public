[tool.poetry]
name = "stream-service"
version = "0.1.0"
description = "Stream Service — Multi-channel event distribution"
authors = ["ChapsMind <dev-chapsmind@chapsvision.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115"
uvicorn = "0.22.0"
sqlalchemy = ">=2.0.35"
psycopg2-binary = ">=2.9.10"
pydantic = ">=2.10"
pydantic-settings = "^2.12.0"
alembic = "1.11.1"
python-dotenv = "1.0.0"
httpx = ">=0.27"
PyJWT = "^2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^4.1.0"
ruff = "^0.9.0"
mypy = "^1.15"

[tool.pytest.ini_options]
addopts = "-v --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/", "tests/"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modern Python syntax)
    "B",     # bugbear (common pitfalls)
    "SIM",   # simplify (code simplification)
    "ASYNC", # async best practices
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function call in default argument (FastAPI Depends pattern)
    "B904",    # raise without from
    "SIM102",  # nested if statements
    "SIM105",  # use contextlib.suppress
    "SIM108",  # use ternary operator
    "UP046",   # Generic[T] subclass (PEP 695 syntax requires Python 3.12+)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
