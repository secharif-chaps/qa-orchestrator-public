version: '3'

vars:
  COMPOSE: docker compose

tasks:
  up:
    desc: Start stream service and run migrations
    cmds:
      - bash infra/scripts/init-profile.sh stream

  lint:
    desc: Lint stream backend code (ruff)
    cmd: "{{.COMPOSE}} exec stream ruff check . {{.CLI_ARGS}}"

  format:
    desc: Format stream backend code (ruff)
    cmd: "{{.COMPOSE}} exec stream ruff format ."

  test:
    desc: Run stream backend tests
    cmd: "{{.COMPOSE}} exec stream pytest"

  mypy:
    desc: Run mypy type checking on stream backend code
    cmd: "{{.COMPOSE}} exec stream mypy app/ --ignore-missing-imports"

  shell:
    desc: Open bash shell in stream backend container
    cmd: "{{.COMPOSE}} exec stream bash"
