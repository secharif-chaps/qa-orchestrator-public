# Frontend GitLab CI/CD Pipeline
# Builds, lints, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-front
  IMAGE_TAG: preprod
  DOCKER_BUILDKIT: 1

.cache-node-modules: &cache-node-modules
  key:
    files:
      - apps/front/yarn.lock
    prefix: yarn
  paths:
    - apps/front/node_modules
  policy: pull

.default-rules: &default-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/front/**/*
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/front/**/*

.yarnrc-setup: &yarnrc-setup
  before_script:
    - cd apps/front
    - cp .yarnrc.dist.yml .yarnrc.yml
    - sed -i "s|<OWLINT_REGISTRY_URL>|$OWLINT_REGISTRY_URL|g" .yarnrc.yml
    - sed -i "s|<OWLINT_DEPLOY_KEY>|$OWLINT_DEPLOY_KEY|g" .yarnrc.yml
    - corepack enable

.default-lint-job: &default-lint-job
  image: node:22-alpine
  cache:
    - <<: *cache-node-modules
  <<: *default-rules

front:install:
  image: node:22-alpine
  stage: Build
  <<: *yarnrc-setup
  script:
    - yarn install --immutable
  cache:
    - <<: *cache-node-modules
      policy: pull-push
  <<: *default-rules
  artifacts:
    expire_in: 1 hour
    paths:
      - apps/front/node_modules

front:eslint:
  <<: *default-lint-job
  stage: CodingStandards
  script:
    - cd apps/front && npx eslint .

front:prettier:
  <<: *default-lint-job
  stage: CodingStandards
  script:
    - cd apps/front && npx prettier --check --no-error-on-unmatched-pattern --ignore-unknown .
  after_script:
    - cd apps/front && npx prettier --list-different --no-error-on-unmatched-pattern --ignore-unknown .

front:stylelint:
  <<: *default-lint-job
  stage: CodingStandards
  script:
    - cd apps/front && npx stylelint "src/**/*.{vue,css}"

.docker-build:
  image: docker:29-cli
  script:
    - echo Building $IMAGE_NAME:$IMAGE_TAG
    - echo "$OWLINT_REGISTRY_URL" > owlint_registry_url.txt
    - echo "$OWLINT_DEPLOY_KEY" > owlint_deploy_key.txt
    - docker build --no-cache --pull --secret id=OWLINT_REGISTRY_URL,src=owlint_registry_url.txt --secret id=OWLINT_DEPLOY_KEY,src=owlint_deploy_key.txt -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/front/
    - rm -f owlint_registry_url.txt owlint_deploy_key.txt

front:docker-build:
  stage: Publish
  extends: .docker-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/front/**/*

front:publish:
  stage: Publish
  extends: .docker-build
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push $IMAGE_NAME:${IMAGE_TAG}
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/front/**/*
