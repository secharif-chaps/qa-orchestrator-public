# Frontend GitLab CI/CD Pipeline
# Builds, lints, tests, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-front
  DOCKER_BUILDKIT: 1

# ─── Reusable blocks ───────────────────────────────────
.cache-node-modules: &cache-node-modules
  key:
    files:
      - apps/front/yarn.lock
    prefix: yarn
  paths:
    - apps/front/node_modules
  policy: pull

# Run all jobs on any branch (not just when files change)
.front-changes: &front-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.yarnrc-setup: &yarnrc-setup
  before_script:
    - cd apps/front
    - cp .yarnrc.dist.yml .yarnrc.yml
    - sed -i "s|<OWLINT_REGISTRY_URL>|$OWLINT_REGISTRY_URL|g" .yarnrc.yml
    - sed -i "s|<OWLINT_DEPLOY_KEY>|$OWLINT_DEPLOY_KEY|g" .yarnrc.yml

.default-lint-job: &default-lint-job
  image: ${CI_REGISTRY}/chapsmind/ci-images/web-linters:latest
  cache:
    - <<: *cache-node-modules
  <<: *front-changes

# ─── Install Stage ─────────────────────────────────────
front:install:
  image: ${CI_REGISTRY}/chapsmind/ci-images/web-linters:latest
  stage: install
  <<: *yarnrc-setup
  script:
    - yarn install --immutable
  cache:
    - <<: *cache-node-modules
      policy: pull-push
  <<: *front-changes
  artifacts:
    expire_in: 1 hour
    paths:
      - apps/front/node_modules

# ─── Lint Stage ────────────────────────────────────────
front:eslint:
  <<: *default-lint-job
  stage: lint
  script:
    - cd apps/front && npx eslint .

front:prettier:
  <<: *default-lint-job
  stage: lint
  script:
    - cd apps/front && npx prettier --check --no-error-on-unmatched-pattern --ignore-unknown .
  after_script:
    - cd apps/front && npx prettier --list-different --no-error-on-unmatched-pattern --ignore-unknown .

front:stylelint:
  <<: *default-lint-job
  stage: lint
  script:
    - cd apps/front && npx stylelint "src/**/*.{vue,css}"

front:typecheck:
  <<: *default-lint-job
  stage: lint
  script:
    - cd apps/front && npx vue-tsc --noEmit -p tsconfig.app.json

# ─── Test Stage ────────────────────────────────────────
front:test:
  <<: *default-lint-job
  stage: test
  script:
    - cd apps/front && npx vitest run --coverage
  artifacts:
    reports:
      junit: apps/front/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/front/coverage/cobertura-coverage.xml
    when: always
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

# ─── Build Stage (Docker) ─────────────────────────────
.front-docker-build:
  image: docker:29-cli
  script:
    - echo "Building $IMAGE_NAME:${IMAGE_TAG}"
    - echo "$OWLINT_REGISTRY_URL" > owlint_registry_url.txt
    - echo "$OWLINT_DEPLOY_KEY" > owlint_deploy_key.txt
    - docker build --no-cache --pull
      --secret id=OWLINT_REGISTRY_URL,src=owlint_registry_url.txt
      --secret id=OWLINT_DEPLOY_KEY,src=owlint_deploy_key.txt
      -t "${IMAGE_NAME}:${IMAGE_TAG}" apps/front/
    - rm -f owlint_registry_url.txt owlint_deploy_key.txt

# Build test (don't push) - runs on all branches
front:docker-build:
  stage: build
  extends: .front-docker-build
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# Main branch: build + push with SHA tag and :latest
# DISABLED: Do not publish on this test branch
front:publish:
  stage: publish
  extends: .front-docker-build
  variables:
    IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" "${IMAGE_NAME}:latest"
    - docker push "${IMAGE_NAME}:latest"
    - docker logout $CI_REGISTRY
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: never
