# Frontend GitLab CI/CD Pipeline
# Builds, lints, tests, and publishes Docker image to GitLab Container Registry
# Stages are defined in the root .gitlab-ci.yml

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-front
  DOCKER_BUILDKIT: 1

# ─── Reusable blocks ───────────────────────────────────
.cache-node-modules: &cache-node-modules
  key:
    files:
      - apps/front/yarn.lock
    prefix: yarn
  paths:
    - apps/front/node_modules
  policy: pull

# Run all jobs on any branch (not just when files change)
.front-changes: &front-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

.yarnrc-setup: &yarnrc-setup
  before_script:
    - cd apps/front
    - cp .yarnrc.dist.yml .yarnrc.yml
    - sed -i "s|<OWLINT_REGISTRY_URL>|$OWLINT_REGISTRY_URL|g" .yarnrc.yml
    - sed -i "s|<OWLINT_DEPLOY_KEY>|$OWLINT_DEPLOY_KEY|g" .yarnrc.yml

.default-lint-job: &default-lint-job
  image: ${CI_REGISTRY}/chapsmind/ci-images/web-linters:latest
  cache:
    - <<: *cache-node-modules
  <<: *front-changes

# ─── Install Stage ─────────────────────────────────────
front:install:
  image: ${CI_REGISTRY}/chapsmind/ci-images/web-linters:latest
  stage: install
  needs: []
  <<: *yarnrc-setup
  script:
    - yarn install --immutable
  cache:
    - <<: *cache-node-modules
      policy: pull-push
  <<: *front-changes
  artifacts:
    expire_in: 1 hour
    paths:
      - apps/front/node_modules

# ─── Lint Stage ────────────────────────────────────────
front:eslint:
  <<: *default-lint-job
  stage: lint
  needs: [front:install]
  script:
    - cd apps/front && npx eslint .

front:prettier:
  <<: *default-lint-job
  stage: lint
  needs: [front:install]
  script:
    - cd apps/front && npx prettier --check --no-error-on-unmatched-pattern --ignore-unknown --ignore-path ../../.prettierignore ../../
  after_script:
    - cd apps/front && npx prettier --list-different --no-error-on-unmatched-pattern --ignore-unknown --ignore-path ../../.prettierignore ../../

front:stylelint:
  <<: *default-lint-job
  stage: lint
  needs: [front:install]
  script:
    - cd apps/front && npx stylelint "src/**/*.{vue,css}"

front:typecheck:
  <<: *default-lint-job
  stage: lint
  needs: [front:install]
  script:
    - cd apps/front && npx vue-tsc --noEmit -p tsconfig.app.json

front:yarn-audit:
  image: ${CI_REGISTRY}/chapsmind/ci-images/web-linters:latest
  stage: lint
  needs: [front:install]
  <<: *yarnrc-setup
  script:
    - yarn npm audit --all
  cache:
    - <<: *cache-node-modules
  <<: *front-changes

front:i18n:
  <<: *default-lint-job
  stage: lint
  needs: [front:install]
  script:
    - cd apps/front
    - node scripts/i18n/check.mjs
    - node scripts/i18n/orphans.mjs

# ─── Test Stage ────────────────────────────────────────
front:test:
  <<: *default-lint-job
  stage: test
  needs: [front:install]
  script:
    - cd apps/front && npx vitest run --coverage
  artifacts:
    reports:
      junit: apps/front/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/front/coverage/cobertura-coverage.xml
    when: always
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'

# ─── Publish (build + tag + push) ─────────────────────
# Front needs Owlint registry secrets for private npm packages.
# Secrets are written to temp files before build (docker --secret requires files).
front:publish:
  interruptible: false
  extends: .docker-publish
  needs:
    [
      front:eslint,
      front:prettier,
      front:stylelint,
      front:typecheck,
      front:yarn-audit,
      front:test,
      front:i18n,
    ]
  variables:
    IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-front
    DOCKER_CONTEXT: apps/front
    DOCKER_BUILD_ARGS: >-
      --secret id=OWLINT_REGISTRY_URL,src=owlint_registry_url.txt
      --secret id=OWLINT_DEPLOY_KEY,src=owlint_deploy_key.txt
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    # Write secrets to temp files (docker --secret requires file sources)
    - echo "$OWLINT_REGISTRY_URL" > owlint_registry_url.txt
    - echo "$OWLINT_DEPLOY_KEY" > owlint_deploy_key.txt
  after_script:
    - rm -f owlint_registry_url.txt owlint_deploy_key.txt
    - docker logout $CI_REGISTRY || true

# ─── Scan Stage (Trivy) ──────────────────────────────
front:trivy:
  extends: .trivy-scan
  needs: [front:publish]
  variables:
    SCAN_IMAGE: ${CI_REGISTRY_IMAGE}/chapsmind-front
