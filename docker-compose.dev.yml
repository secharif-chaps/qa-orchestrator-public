services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mint_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"  # Using 5434 externally to avoid conflict with other postgres instances
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    restart: always
    env_file:
      - .env.dev
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app

  # Keycloak for Authentication
  keycloak:
    image: keycloak/keycloak:26.3
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
    command: start-dev --import-realm
    volumes:
      - ./docker/keycloak/themes/mint:/opt/keycloak/themes/mint
      - ./docker/keycloak/realm-mint-dev.json:/opt/keycloak/data/import/realm-mint-dev.json
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: always
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Celery Worker for Task Processing
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.celery
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --pool=solo
    restart: always
    env_file:
      - .env.dev
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      MAX_CONCURRENT_WORKFLOWS: 10
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  # Flower Dashboard for Monitoring
  celery_flower:
    build:
      context: .
      dockerfile: Dockerfile.celery
    command: celery -A app.core.celery_app flower --port=5555 --broker=amqp://guest:guest@rabbitmq:5672//
    restart: always
    ports:
      - "5555:5555"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      FLOWER_BASIC_AUTH: admin:admin  # Change in production
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
  rabbitmq_data: 

  