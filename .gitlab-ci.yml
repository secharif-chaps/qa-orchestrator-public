# Deploy job (example - adjust according to your deployment needs)
deploy:
  stage: deploy
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker build -t mint-front -f mint-front/Dockerfile mint-front/
    - docker build -t mint-back -f mint-back/Dockerfile mint-back/
  only:
    - main 