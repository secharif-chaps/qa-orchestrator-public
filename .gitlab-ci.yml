# Frontend GitLab CI/CD Pipeline
# Builds and publishes Docker image to GitLab Container Registry on main branch

stages:
  - build
  - publish

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: '/certs'
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/mint-front
  DOCKER_BUILDKIT: 1

# Build and push Docker image on main branch
build-and-push-frontend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    # Login to registry
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    # Generate .env.production from GitLab CI/CD variables
    - |
      echo "Creating .env.production file..."
      cat > .env.production << EOF
      VITE_BASE_URL=${VITE_BASE_URL}
      VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}
      VITE_BACKEND_API=${VITE_BACKEND_API}
      VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID}
      EOF
      echo "✅ .env.production file created"
  script:
    - |
      echo "Building frontend Docker image..."
      echo " DEBUG : docker build --no-cache --pull -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -t ${IMAGE_NAME}:latest ."
      docker build --no-cache --pull -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" -t "${IMAGE_NAME}:latest" .
      echo "Pushing images to registry..."
      docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
      docker push $IMAGE_NAME:latest
      echo "✅ Frontend image published successfully!"
      echo "📦 Image: $IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      echo "📦 Image: $IMAGE_NAME:latest"
  after_script:
    - docker logout $CI_REGISTRY
  only:
    - main

# Optional: Build on merge requests for testing (without pushing)
test-build-frontend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    # Generate .env.production from GitLab CI/CD variables
    - |
      echo "Creating .env.production file..."
      cat > .env.production << EOF
      VITE_BASE_URL=${VITE_BASE_URL}
      VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM}
      VITE_BACKEND_API=${VITE_BACKEND_API}
      VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID}
      EOF
      echo "✅ .env.production file created"
  script:
    - echo "Testing frontend Docker build..."
    - docker build --tag mint-front:test .
    - echo "✅ Frontend build test passed!"
  only:
    - merge_requests
