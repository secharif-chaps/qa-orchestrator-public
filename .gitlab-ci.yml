# Backend GitLab CI/CD Pipeline
# Builds and publishes Docker image to GitLab Container Registry on main branch

stages:
  - build
  - publish

variables:
  IMAGE_NAME: ${CI_REGISTRY_IMAGE}/mint-back
  IMAGE_TAG: preprod
  DOCKER_BUILDKIT: 1

.build:
  image: docker:29-cli
  script:
    - echo Building $IMAGE_NAME:$IMAGE_TAG
    - docker build --no-cache --pull -t "${IMAGE_NAME}:${IMAGE_TAG}" .

publish:
  stage: publish
  extends: .build
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  after_script:
    - docker push $IMAGE_NAME:${IMAGE_TAG}
    - docker logout $CI_REGISTRY
  only:
    - main

build:
  stage: build
  extends: .build
  only:
    - merge_requests
