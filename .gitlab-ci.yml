# GitLab CI — Monorepo orchestrator
# Each app owns its CI config. This file only defines stages, includes, and shared templates.
# Doc: https://docs.gitlab.com/ee/ci/yaml/#include

stages:
  - install
  - lint
  - test
  - build
  - publish
  - maintenance

variables:
  AST_ENABLE_MR_PIPELINES: true

include:
  # App CI configs
  - local: apps/front/.gitlab-ci.yml
  - local: apps/screen/.gitlab-ci.yml
  - local: apps/global-service/.gitlab-ci.yml
  - local: infra/.gitlab-ci.yml
  # AI-powered jobs (auto-review, dev-agent, ticket scanner)
  - local: .gitlab/ai-jobs.gitlab-ci.yml
  # GitLab security templates (free tier — results as JSON artifacts)
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# ─── Shared Docker templates ──────────────────────────
# Used by publish jobs in app CI files via `extends`
.docker-login:
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

# ─── Override security template stages ────────────────
# SAST and Secret Detection templates default to stage: test which doesn't exist
sast:
  stage: lint
  needs: []

secret_detection:
  stage: lint
  needs: []

# ─── Commit message lint ──────────────────────────────
# ─── Skills validation ──────────────────────────────
main:validate-skills:
  stage: lint
  needs: []
  image: node:22-alpine
  rules:
    - changes:
        - .claude/skills/**/*
  script:
    - for dir in .claude/skills/*/; do npx skills-ref validate "$dir" || exit 1; done

main:commitlint:
  stage: lint
  needs: []
  image:
    name: commitlint/commitlint:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - git fetch origin main --depth=50
    - commitlint --from "origin/main" --to HEAD --config commitlint.config.mjs

# ─── Assign reviewers based on CODEOWNERS ─────────────
# Only runs on MRs (requires CI_MERGE_REQUEST_IID)
main:assign-reviewers:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python .gitlab/scripts/assign_reviewers.py
  variables:
    GITLAB_TOKEN: $REVIEWER_BOT_TOKEN

# ─── Scheduled maintenance jobs ──────────────────────
main:update-codeowners:
  stage: maintenance
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  script:
    - python .gitlab/scripts/generate_codeowners.py --min-commits 5 --months 6
    - |
      if git diff --quiet .gitlab/CODEOWNERS; then
        echo "CODEOWNERS is up to date"
        exit 0
      fi
      echo "CODEOWNERS changed — creating MR"
      BRANCH="chore/update-codeowners-$(date +%Y%m%d)"
      git config user.email "ci-bot@chapsvision.com"
      git config user.name "CI Bot"
      git checkout -b "$BRANCH"
      git add .gitlab/CODEOWNERS
      git commit -m "chore: update CODEOWNERS from git history"
      git push "https://gitlab-ci-token:${REVIEWER_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BRANCH"
      # Create MR via GitLab API
      curl --fail --silent --header "PRIVATE-TOKEN: ${REVIEWER_BOT_TOKEN}" \
        --data-urlencode "source_branch=${BRANCH}" \
        --data-urlencode "target_branch=main" \
        --data-urlencode "title=chore: update CODEOWNERS from git history" \
        --data-urlencode "remove_source_branch=true" \
        "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests"
