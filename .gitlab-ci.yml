image: python:3.11

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - docker-build

# Cache dependencies between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - mint-front/node_modules/
    - mint-back/.cache/pypoetry/

# Frontend build job
build-frontend:
  stage: build
  image: node:18
  script:
    - cd mint-front
    - yarn install --frozen-lockfile
    - yarn build
  artifacts:
    paths:
      - mint-front/.output/
    expire_in: 1 week
  only:
    - main
    - merge_requests

# Backend build job
build-backend:
  stage: build
  script:
    - cd mint-back
    - curl -sSL https://install.python-poetry.org | python3 -
    - export PATH="$HOME/.local/bin:$PATH"
    - poetry config virtualenvs.create false
    - poetry install --no-interaction --no-ansi
    - poetry add --group dev pytest pytest-cov
  artifacts:
    paths:
      - mint-back/.cache/pypoetry/
    expire_in: 1 week
  only:
    - main
    - merge_requests


# Deploy job (example - adjust according to your deployment needs)
deploy:
  stage: docker-build
  script:
    - docker build -t mint-front -f mint-front/Dockerfile mint-front/
    - docker build -t mint-back -f mint-back/Dockerfile mint-back/
  only:
    - main

    # configurer le registry gitlab pour pouvoir push des images dans le registry gitlab depuis la ci
    # puis recup la clé pour acceder au registry gitlab depuis le serveur