# Backend GitLab CI/CD Pipeline
# Builds and publishes Docker image to GitLab Container Registry on main branch

stages:
  - build
  - publish

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: $CI_REGISTRY/mint/mint-back
  DOCKER_BUILDKIT: 1

# Build and push Docker image on main branch
build-and-push-backend:
  stage: build
  image: docker:24-dind
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # If RELEASE_VERSION is not defined, image is tagged with `latest`
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - |
      echo "Building backend Docker image..."
      docker build \
        --cache-from $IMAGE_NAME:latest \
        --tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA \
        --tag $IMAGE_NAME:latest \
        .
      echo "Pushing images to registry..."
      docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
      docker push $IMAGE_NAME:latest
      echo "✅ Backend image published successfully!"
      echo "📦 Image: $IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      echo "📦 Image: $IMAGE_NAME:latest"
  after_script:
    - docker logout $CI_REGISTRY
  only:
    - main

# Optional: Build on merge requests for testing (without pushing)
test-build-backend:
  stage: build
  image: docker:24-dind
  services:
    - name: docker:24-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Testing backend Docker build..."
    - docker build --tag mint-back:test .
    - echo "✅ Backend build test passed!"
  only:
    - merge_requests

