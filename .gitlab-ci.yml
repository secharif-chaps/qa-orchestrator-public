# GitLab CI — Monorepo orchestrator
# Each app owns its CI config. This file only defines stages, includes, and shared templates.
# Doc: https://docs.gitlab.com/ee/ci/yaml/#include

stages:
  - install
  - lint
  - test
  - publish
  - scan
  - deploy
  - maintenance

variables:
  AST_ENABLE_MR_PIPELINES: true

include:
  # App CI configs
  - local: apps/front/.gitlab-ci.yml
  - local: apps/screen/.gitlab-ci.yml
  - local: apps/global-service/.gitlab-ci.yml
  - local: apps/stream/.gitlab-ci.yml
  - local: infra/.gitlab-ci.yml
  # AI-powered jobs (auto-review, dev-agent, ticket scanner)
  - local: .gitlab/ai-jobs.gitlab-ci.yml
  # GitLab security templates (free tier — results as JSON artifacts)
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# ─── Shared Docker publish template ──────────────────
# Single job per image: build + tag + push.
#
# Tag policy:
#   MR          → mr-{IID}, sha-{SHORT_SHA}
#   main        → main, sha-{SHORT_SHA}
#   tag X.Y.Z-rc.N → X.Y.Z-rc.N, rc, sha-{SHORT_SHA}
#   tag X.Y.Z      → X.Y.Z, latest, sha-{SHORT_SHA}
#
# Usage in app CI:
#   extends: .docker-publish
#   variables:
#     IMAGE_NAME: ${CI_REGISTRY_IMAGE}/chapsmind-screen
#     DOCKER_CONTEXT: apps/screen
#     DOCKER_BUILD_ARGS: ""  # optional extra --build-arg or --secret flags
.docker-publish:
  stage: publish
  image: docker:29-cli
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    # Determine tags based on context
    - TAGS=""
    - SHA_TAG="sha-${CI_COMMIT_SHORT_SHA}"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Release tag: X.Y.Z or X.Y.Z-rc.N
        TAGS="$CI_COMMIT_TAG"
        if echo "$CI_COMMIT_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
          TAGS="$TAGS rc"
        elif echo "$CI_COMMIT_TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          TAGS="$TAGS latest"
        fi
      elif [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        TAGS="main"
      elif [ -n "$CI_MERGE_REQUEST_IID" ]; then
        TAGS="mr-${CI_MERGE_REQUEST_IID}"
      else
        TAGS="$CI_COMMIT_REF_SLUG"
      fi
    # Build image with OCI labels
    - VERSION=$(echo "$TAGS" | awk '{print $1}')
    - CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    - echo "Building ${IMAGE_NAME} — tags:${TAGS} ${SHA_TAG}"
    - >
      docker build --pull
      --build-arg VERSION="${VERSION}"
      --label "org.opencontainers.image.created=${CREATED}"
      --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}"
      ${DOCKER_BUILD_ARGS}
      -t "${IMAGE_NAME}:build"
      "${DOCKER_CONTEXT}/"
    # Tag and push all tags
    - |
      for TAG in $TAGS $SHA_TAG; do
        docker tag "${IMAGE_NAME}:build" "${IMAGE_NAME}:${TAG}"
        docker push "${IMAGE_NAME}:${TAG}"
        echo "  → pushed ${IMAGE_NAME}:${TAG}"
      done
  after_script:
    - docker logout $CI_REGISTRY || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/

# ─── Trivy container scanning template ───────────────
# Reusable template for scanning Docker images with Trivy.
# Each app extends this with its own image name and publish dependency.
# Scans from the registry (images are pushed by .docker-publish).
# Tag resolution mirrors .docker-publish tag policy.
.trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.69.3
    entrypoint: [""]
  allow_failure: true
  variables:
    TRIVY_SEVERITY: CRITICAL,HIGH
    TRIVY_EXIT_CODE: "1"
    TRIVY_USERNAME: ${CI_REGISTRY_USER}
    TRIVY_PASSWORD: ${CI_REGISTRY_PASSWORD}
    TRIVY_CACHE_DIR: .cache/trivy
  script:
    # Determine image tag (same logic as .docker-publish)
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]; then
        IMAGE_TAG="main"
      elif [ -n "$CI_MERGE_REQUEST_IID" ]; then
        IMAGE_TAG="mr-${CI_MERGE_REQUEST_IID}"
      else
        IMAGE_TAG="$CI_COMMIT_REF_SLUG"
      fi
    - echo "Scanning ${SCAN_IMAGE}:${IMAGE_TAG}"
    - trivy image
      --severity ${TRIVY_SEVERITY}
      --exit-code ${TRIVY_EXIT_CODE}
      --format json
      --output trivy-report.json
      "${SCAN_IMAGE}:${IMAGE_TAG}" || TRIVY_RC=$?
    # Print summary to job log (reuses cached DB and image layers)
    - trivy image
      --severity ${TRIVY_SEVERITY}
      --format table
      --skip-db-update
      "${SCAN_IMAGE}:${IMAGE_TAG}"
    - exit ${TRIVY_RC:-0}
  artifacts:
    paths:
      - trivy-report.json
    when: always
    expire_in: 7 days
  cache:
    key: trivy-db
    paths:
      - .cache/trivy/
    policy: pull-push
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$/

# ─── Override security template stages ────────────────
sast:
  stage: lint
  needs: []

secret_detection:
  stage: lint
  needs: []

# ─── Skills validation ──────────────────────────────
main:validate-skills:
  stage: lint
  needs: []
  image: node:22-alpine
  rules:
    - changes:
        - .claude/skills/**/*
  script:
    - for dir in .claude/skills/*/; do npx skills-ref validate "$dir" || exit 1; done

main:commitlint:
  stage: lint
  needs: []
  image:
    name: commitlint/commitlint:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - git fetch origin main --depth=50
    - commitlint --from "origin/main" --to HEAD --config commitlint.config.mjs

# ─── Assign reviewers based on CODEOWNERS ─────────────
main:assign-reviewers:
  stage: lint
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python .gitlab/scripts/assign_reviewers.py
  variables:
    GITLAB_TOKEN: $REVIEWER_BOT_TOKEN

# ─── Scheduled maintenance jobs ──────────────────────
main:update-codeowners:
  stage: maintenance
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB_TYPE == "update-codeowners"
  image: ${CI_REGISTRY}/chapsmind/ci-images/python-ci:latest
  variables:
    GIT_DEPTH: 0
  script:
    - python .gitlab/scripts/generate_codeowners.py --min-commits 5 --months 6
    - |
      if git diff --quiet .gitlab/CODEOWNERS; then
        echo "CODEOWNERS is up to date"
        exit 0
      fi
      echo "CODEOWNERS changed — creating MR"
      BRANCH="chore/update-codeowners-$(date +%Y%m%d)"
      git config user.email "ci-bot@chapsvision.com"
      git config user.name "CI Bot"
      git checkout -b "$BRANCH"
      git add .gitlab/CODEOWNERS
      git commit -m "chore: update CODEOWNERS from git history"
      git push "https://gitlab-ci-token:${REVIEWER_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BRANCH"
      # Create MR via GitLab API
      curl --fail --silent --header "PRIVATE-TOKEN: ${REVIEWER_BOT_TOKEN}" \
        --data-urlencode "source_branch=${BRANCH}" \
        --data-urlencode "target_branch=main" \
        --data-urlencode "title=chore: update CODEOWNERS from git history" \
        --data-urlencode "remove_source_branch=true" \
        "https://${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/merge_requests"
