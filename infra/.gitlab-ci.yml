# ─── Infrastructure CI ─────────────────────────────
# Owned by: team-devops
# Only runs when infra/ files change

.infra-changes: &infra-changes
  changes:
    - infra/**/*

infra:validate:
  stage: CodingStandards
  rules:
    - <<: *infra-changes
  image: docker:cli
  script:
    - docker compose -f infra/compose.yaml -f infra/compose.local.yaml config --quiet
