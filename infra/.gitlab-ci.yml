# ─── Infrastructure CI ─────────────────────────────
# Owned by: team-devops
# Runs on all branches (not just when infra/ files change)

# Run all jobs on any branch (not just when files change)
.infra-changes: &infra-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $AGENT_ISSUE
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

infra:validate:
  stage: lint
  needs: []
  <<: *infra-changes
  image: docker:29-cli
  script:
    - >-
      docker compose
      -f infra/compose.yaml
      -f infra/compose.local.yaml
      config --quiet

infra:validate-staging:
  stage: lint
  <<: *infra-changes
  image: docker:29-cli
  script:
    - >-
      docker compose
      -f infra/compose.yaml
      -f infra/compose.staging.yaml
      config --quiet

# ─── Hadolint — Dockerfile linting ───────────────────
infra:hadolint:
  stage: lint
  needs: []
  <<: *infra-changes
  image: hadolint/hadolint:v2.14.0-debian
  allow_failure: true
  script:
    - hadolint --format json
      apps/front/Dockerfile
      apps/screen/Dockerfile
      apps/global-service/Dockerfile
      apps/stream/Dockerfile
      apps/target/Dockerfile
      > hadolint-report.json || true
    - hadolint
      apps/front/Dockerfile
      apps/screen/Dockerfile
      apps/global-service/Dockerfile
      apps/stream/Dockerfile
      apps/target/Dockerfile
  artifacts:
    paths:
      - hadolint-report.json
    when: always
    expire_in: 7 days

# ─── Trivy config — Dockerfile & Compose misconfigs ──
infra:trivy-config:
  stage: lint
  needs: []
  <<: *infra-changes
  image:
    name: aquasec/trivy:0.69.3
    entrypoint: [""]
  allow_failure: true
  script:
    - trivy config
      --severity CRITICAL,HIGH,MEDIUM
      --exit-code 1
      --format json
      --output trivy-config-report.json
      --skip-files infra/compose.local.yaml
      --file-patterns "dockerfile:Dockerfile"
      .
      || TRIVY_RC=$?
    # Print human-readable summary (exit code from first pass is propagated below)
    - trivy config
      --severity CRITICAL,HIGH,MEDIUM
      --skip-files infra/compose.local.yaml
      --file-patterns "dockerfile:Dockerfile"
      .
    - exit ${TRIVY_RC:-0}
  artifacts:
    paths:
      - trivy-config-report.json
    when: always
    expire_in: 7 days

# ─── Deploy templates ──────────────────────────────
.deploy-base:
  stage: deploy
  image: ${CI_REGISTRY}/chapsmind/ci-images/auto-deploy:latest
  tags:
    - staging
  needs:
    - job: front:publish
      optional: true
    - job: screen:publish
      optional: true
    - job: stream:publish
      optional: true
    - job: global-service:publish
      optional: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  after_script:
    - docker logout $CI_REGISTRY || true
  artifacts:
    reports:
      dotenv: deploy.env
  script:
    # Determine image tag and subdomain
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
        SUB_DOMAIN="${DEPLOY_SUB_DOMAIN:-rc}"
      elif [ -n "$CI_MERGE_REQUEST_IID" ]; then
        IMAGE_TAG="mr-${CI_MERGE_REQUEST_IID}"
        SUB_DOMAIN="mr-${CI_MERGE_REQUEST_IID}"
      else
        # main branch — .docker-publish pushes tag "main"
        IMAGE_TAG="main"
        SUB_DOMAIN="${DEPLOY_SUB_DOMAIN:-chapsmind}"
      fi
    - DYNAMIC_ENVIRONMENT_URL="https://${SUB_DOMAIN}.${BASE_DOMAIN}"
    - echo "DYNAMIC_ENVIRONMENT_URL=${DYNAMIC_ENVIRONMENT_URL}" >> deploy.env

    # Build deploy artifact directory with compose files and .env
    - mkdir -p deploy-artifact
    - cp infra/compose.yaml deploy-artifact/
    - cp infra/compose.staging.yaml deploy-artifact/
    - cp -r infra/files deploy-artifact/files
    # Copy internal CA cert for TLS (*.localnet services)
    # Sets CA_CERT_AVAILABLE for the .env template below
    - |
      CA_CERT_AVAILABLE=""
      if [ -n "${CA_CERT_LOCALNET_FILE:-}" ] && [ -f "$CA_CERT_LOCALNET_FILE" ]; then
        cp "$CA_CERT_LOCALNET_FILE" deploy-artifact/files/localnet-ca.crt
        CA_CERT_AVAILABLE="./files/localnet-ca.crt"
      fi

    # Generate .env template for NEW staging environments.
    # auto-deploy-staging.py only uses this for first-time setup —
    # existing environments keep their .env (secrets are NOT overwritten).
    - |
      cat > deploy-artifact/.env << ENVEOF
      COMPOSE_FILE=compose.yaml:compose.staging.yaml
      COMPOSE_PROJECT_NAME=chapsmind-${SUB_DOMAIN}
      ENV_NAME_SLUG=chapsmind-${SUB_DOMAIN}
      SERVER_NAME=${SUB_DOMAIN}.${BASE_DOMAIN}
      DOCKER_REGISTRY=${CI_REGISTRY_IMAGE}
      DOCKER_CHAPSMIND_VERSION=${IMAGE_TAG}
      POSTGRES_USER=chapsmind
      POSTGRES_PASSWORD=$(openssl rand -hex 16)
      POSTGRES_DB=screen_db
      GLOBAL_DB=global_db
      STREAM_DB=stream_db
      INTERNAL_JWT_SECRET=$(openssl rand -hex 32)
      ENCRYPTION_KEY=$(openssl rand -base64 32 | tr '+/' '-_')
      KEYCLOAK_SERVER_URL=${DEPLOY_KEYCLOAK_URL:-https://sso.deveryware.team/auth}
      KEYCLOAK_REALM=${DEPLOY_KEYCLOAK_REALM:-chapsmind-internal}
      KEYCLOAK_CLIENT_ID=${KEYCLOAK_BACK_CLIENT_ID:-chapsmind-global-service-back}
      KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_BACK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-chapsmind-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET}
      VITE_KEYCLOAK_URL=${DEPLOY_KEYCLOAK_URL:-https://sso.deveryware.team/auth}
      VITE_KEYCLOAK_REALM=${DEPLOY_KEYCLOAK_REALM:-chapsmind-internal}
      VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_FRONT_CLIENT_ID:-chapsmind-front}
      VITE_APP_CLARITY_PROJECT_ID=${CLARITY_PROJECT_ID:-}
      LLM_PROVIDER=${STAGING_LLM_PROVIDER:-}
      LLM_API_KEY=${STAGING_LLM_API_KEY:-}
      LLM_BASE_URL=${STAGING_LLM_BASE_URL:-}
      LLM_API_VERSION=${STAGING_LLM_API_VERSION:-}
      SYSTRAN_API_KEY=${SYSTRAN_API_KEY:-}
      LOKI_URL=${LOKI_URL:-https://loki-monitoring.dev.target.localnet}
      LOKI_HOST=${LOKI_HOST:-loki-monitoring.dev.target.localnet}
      CA_CERT_PATH=${CA_CERT_PATH:-${CA_CERT_AVAILABLE}}
      ENVEOF

    # Determine deploy args based on MR or branch mode
    # Run auto-deploy
    # Note: --commit-message uses first line only to avoid shell quoting issues
    - |
      COMMIT_FIRST_LINE=$(echo "$CI_COMMIT_MESSAGE" | head -n1)

      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        python /app/auto-deploy-staging.py deploy \
          --env-dir /opt/chapsmind/staging \
          --url "${DYNAMIC_ENVIRONMENT_URL}" \
          --project-id "$CI_PROJECT_ID" \
          --commit-sha "$CI_COMMIT_SHA" \
          --commit-message "$COMMIT_FIRST_LINE" \
          --gitlab-env-name "${DEPLOY_GITLAB_ENV_NAME}" \
          --gitlab-url "${CI_SERVER_URL}" \
          --gitlab-project-path "${CI_PROJECT_PATH}" \
          --artifact-path "$(pwd)/deploy-artifact" \
          --mr-id "$CI_MERGE_REQUEST_IID" \
          --mr-status opened \
          --mr-title "${CI_MERGE_REQUEST_TITLE}" \
          --branch-name "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      else
        python /app/auto-deploy-staging.py deploy \
          --env-dir /opt/chapsmind/staging \
          --url "${DYNAMIC_ENVIRONMENT_URL}" \
          --env-name "$SUB_DOMAIN" \
          --project-id "$CI_PROJECT_ID" \
          --commit-sha "$CI_COMMIT_SHA" \
          --commit-message "$COMMIT_FIRST_LINE" \
          --gitlab-env-name "${DEPLOY_GITLAB_ENV_NAME}" \
          --gitlab-url "${CI_SERVER_URL}" \
          --gitlab-project-path "${CI_PROJECT_PATH}" \
          --artifact-path "$(pwd)/deploy-artifact" \
          --branch-name "${CI_COMMIT_TAG:-$CI_COMMIT_BRANCH}" \
          --no-autoclean
      fi

.staging-vars: &staging-vars
  BASE_DOMAIN: staging.target.localnet
  DEPLOY_GITLAB_ENV_NAME: staging/$CI_COMMIT_REF_SLUG

# ─── Staging deploy (MR review environments) ──────
staging-deploy:
  extends: .deploy-base
  variables:
    <<: *staging-vars
  environment:
    name: staging/$CI_COMMIT_REF_SLUG
    url: $DYNAMIC_ENVIRONMENT_URL
    on_stop: staging-stop
  rules:
    - if: $AGENT_ISSUE
      when: never
    # Scheduled deploy: main staging every 4h during business hours
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB_TYPE == "staging-deploy"
      when: on_success
    # Block all other scheduled pipelines
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event"
        && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^renovate\//
      when: never
    # Auto-deploy if MR has "staging" label, manual otherwise
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /staging/
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# ─── Stop environment (triggered on MR close) ─────
staging-stop:
  stage: deploy
  image: ${CI_REGISTRY}/chapsmind/ci-images/auto-deploy:latest
  tags:
    - staging
  needs: []
  variables:
    <<: *staging-vars
    GIT_STRATEGY: none
  environment:
    name: staging/$CI_COMMIT_REF_SLUG
    action: stop
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        python /app/auto-deploy-staging.py clean \
          --env-dir /opt/chapsmind/staging \
          --url "https://mr-${CI_MERGE_REQUEST_IID}.${BASE_DOMAIN}" \
          --project-id "$CI_PROJECT_ID" \
          --mr-id "$CI_MERGE_REQUEST_IID"
      else
        python /app/auto-deploy-staging.py clean \
          --env-dir /opt/chapsmind/staging \
          --url "https://${CI_COMMIT_REF_SLUG}.${BASE_DOMAIN}" \
          --project-id "$CI_PROJECT_ID" \
          --env-name "$CI_COMMIT_REF_SLUG"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    # Main env is permanent but stop must be available for GitLab to link on_stop
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "schedule" && $JOB_TYPE == "staging-deploy"
      when: manual
      allow_failure: true

# ─── Scheduled cleanup of old environments ─────────
staging-cleanup:
  stage: maintenance
  needs: []
  image: ${CI_REGISTRY}/chapsmind/ci-images/auto-deploy:latest
  tags:
    - staging
  script:
    - |
      python /app/auto-deploy-staging.py cleanup-closed \
        --project-id "$CI_PROJECT_ID" \
        --env-dir /opt/chapsmind/staging \
        --max-age 7 \
        --max-without-update-age 3 \
        --gitlab-url "${CI_SERVER_URL}" \
        --gitlab-project-path "${CI_PROJECT_PATH}"
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "schedule"
        && $SCHEDULE_TYPE == "StagingCleanup"
