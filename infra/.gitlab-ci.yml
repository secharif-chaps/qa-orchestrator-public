# ─── Infrastructure CI ─────────────────────────────
# Owned by: team-devops
# Runs on all branches (not just when infra/ files change)

# Run all jobs on any branch (not just when files change)
.infra-changes: &infra-changes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

infra:validate:
  stage: lint
  <<: *infra-changes
  allow_failure: true
  image: docker:29-cli
  script:
    - docker compose -f infra/compose.yaml -f infra/compose.local.yaml config --quiet
