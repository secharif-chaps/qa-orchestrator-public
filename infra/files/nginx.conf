# Conditional WebSocket upgrade — only set Connection when Upgrade is present
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # Resolve DNS at runtime
    # 127.0.0.11 = Docker Engine embedded DNS
    # 10.89.1.1  = Podman aardvark-dns (WSL2 rootless/Podman)
    resolver 127.0.0.11 10.89.1.1 valid=10s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";

    # HTTP/1.1 keepalive toward upstreams
    proxy_http_version 1.1;

    # Upload size limit
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ─── API + docs (via Gateway) ─────────────────────
    location ~ ^/(api|docs|redoc|openapi\.json)(/|$) {
        set $backend http://global-service:8000;
        proxy_pass $backend;
        proxy_set_header Connection "";

        # SSE: buffering is disabled per-request via X-Accel-Buffering header
        # sent by the backend on StreamingResponse endpoints

        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ─── Application WebSocket ────────────────────────
    location /ws {
        set $backend http://global-service:8000;
        proxy_pass $backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Mercure hub (Target real-time SSE) ───────────
    # Proxied via Global Service (auth exception: Mercure JWT is self-sufficient)
    location /.well-known/mercure {
        set $mercure http://global-service:8000;
        proxy_pass $mercure;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Frontend (catch-all) ─────────────────────────
    location / {
        set $front http://frontend:3000;
        proxy_pass $front;

        # Upgrade to WebSocket only when requested (Vite HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}