# Conditional WebSocket upgrade — only set Connection when Upgrade is present
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;

    # Resolve DNS at runtime (Docker internal DNS)
    resolver 127.0.0.11 valid=10s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Upload size limit
    client_max_body_size 50M;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ─── API (via Gateway) ────────────────────────────
    location /api {
        set $backend http://global-service:8001;
        proxy_pass $backend;

        # SSE: buffering is disabled per-request via X-Accel-Buffering header
        # sent by the backend on StreamingResponse endpoints

        # CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ─── API Documentation (Swagger/ReDoc via Gateway) ──
    location /docs {
        set $backend http://global-service:8001;
        proxy_pass $backend;
    }

    location /redoc {
        set $backend http://global-service:8001;
        proxy_pass $backend;
    }

    location /openapi.json {
        set $backend http://global-service:8001;
        proxy_pass $backend;
    }

    # ─── Application WebSocket ────────────────────────
    location /ws {
        set $backend http://global-service:8001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Frontend (catch-all) ─────────────────────────
    location / {
        set $front http://frontend:3000;
        proxy_pass $front;

        # Upgrade to WebSocket only when requested (Vite HMR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
