# ─── Shared environment blocks (YAML anchors) ─────────────────
x-screen-db: &screen-db
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-chapsmind_db}

x-rabbitmq: &rabbitmq-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//

x-keycloak-client: &keycloak-client
  KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-chapsmind}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-chapsmind-screen-back}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

x-keycloak-admin: &keycloak-admin
  KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}

x-internal-auth: &internal-auth
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
  INTERNAL_ALLOWED_IPS: ${INTERNAL_ALLOWED_IPS:-}

x-encryption: &encryption
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}

# ─── Services ──────────────────────────────────────────
services:
  # Vue Frontend
  frontend:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-front:${DOCKER_CHAPSMIND_VERSION:-latest}
    restart: unless-stopped

  # FastAPI Backend (Screen)
  screen:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-screen:${DOCKER_CHAPSMIND_VERSION:-latest}
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    environment:
      <<: [*screen-db, *rabbitmq-env, *keycloak-client, *keycloak-admin, *internal-auth, *encryption]
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost}
      MAX_CONCURRENT_WORKFLOWS: ${MAX_CONCURRENT_WORKFLOWS:-10}
      SYSTRAN_API_KEY: ${SYSTRAN_API_KEY:-}

  # Celery Worker for Task Processing
  screen_celery_worker:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-screen:${DOCKER_CHAPSMIND_VERSION:-latest}
    entrypoint: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --pool=solo --queues=dify_workflows
    restart: unless-stopped
    environment:
      <<: [*screen-db, *rabbitmq-env, *encryption]
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost}
      MAX_CONCURRENT_WORKFLOWS: ${MAX_CONCURRENT_WORKFLOWS:-10}
    depends_on:
      rabbitmq: { condition: service_healthy }
      db: { condition: service_healthy }

  # Global Service (Gateway) — Proxies /api requests to backend
  global-service:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-global-service:${DOCKER_CHAPSMIND_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: [*keycloak-client, *keycloak-admin, *internal-auth]
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: global-service
      API_HOST: "0.0.0.0"
      API_PORT: 8001
      GRPC_PORT: 50051
      BACKEND_BASE_URL: http://screen:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${GLOBAL_DB:-global_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}

  # PostgreSQL Database
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-chapsmind_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./files/db/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
