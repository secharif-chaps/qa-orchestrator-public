# ─── Shared environment blocks (YAML anchors) ─────────────────
x-screen-db: &screen-db
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-screen_db}

x-keycloak-client: &keycloak-client
  KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-chapsmind}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-chapsmind-global-service-back}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

x-keycloak-admin: &keycloak-admin
  KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}

x-internal-auth: &internal-auth
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
  INTERNAL_ALLOWED_IPS: ${INTERNAL_ALLOWED_IPS:-}

x-encryption: &encryption
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}

x-n8n-db: &n8n-db
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: db
  DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n_db}
  DB_POSTGRESDB_USER: ${N8N_DB_USER:-postgres}
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-postgres}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-!ChangeThisN8nEncryptionKey!}

# Default owner credentials — consumed by the n8n entrypoint on first boot
# to auto-create the admin user.
x-n8n-default-user: &n8n-default-user
  N8N_DEFAULT_EMAIL: ${N8N_DEFAULT_EMAIL:-admin@chapsmind.local}
  N8N_DEFAULT_PASSWORD: ${N8N_DEFAULT_PASSWORD:-Chapsmind2025!}
  N8N_DEFAULT_FIRSTNAME: ${N8N_DEFAULT_FIRSTNAME:-ChapsMind}
  N8N_DEFAULT_LASTNAME: ${N8N_DEFAULT_LASTNAME:-Admin}

x-target-env: &target-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${TARGET_DB:-target_db}
  MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@target-rabbitmq:5672/%2f/messages
  VALKEY_DSN: redis://target-valkey:6379
  OPENSEARCH_URL: http://target-opensearch:9200
  APP_ENV: ${APP_ENV:-prod}
  APP_SECRET: ${TARGET_APP_SECRET:-!ChangeThisTargetAppSecret!}
  INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET:-!ChangeThisInternalJWTSecretKey!!}
  INTERNAL_ALLOWED_IPS: ${INTERNAL_ALLOWED_IPS:-}
  GLOBAL_SERVICE_URL: http://global-service:8000/api
  # Cloudflare Browser Rendering — used by HtmlFetcher for manual document
  # creation (HTTP API + CLI). Empty in defaults; the client raises a clear
  # "not configured" error when these are missing.
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_BR_API_TOKEN: ${CLOUDFLARE_BR_API_TOKEN:-}

# ─── Services ──────────────────────────────────────────
services:
  # Vue Frontend
  frontend:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-front:${DOCKER_CHAPSMIND_VERSION:-latest}
    restart: unless-stopped

  # FastAPI Backend (Screen)
  screen:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-screen:${DOCKER_CHAPSMIND_VERSION:-latest}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    environment:
      <<: [*screen-db, *keycloak-client, *keycloak-admin, *internal-auth, *encryption]
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://localhost}
      MAX_CONCURRENT_WORKFLOWS: ${MAX_CONCURRENT_WORKFLOWS:-10}
      SYSTRAN_API_KEY: ${SYSTRAN_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.1-sweden}
      LLM_API_VERSION: ${LLM_API_VERSION:-}


  # FastAPI Backend (Stream) — Multi-channel event distribution
  stream:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-stream:${DOCKER_CHAPSMIND_VERSION:-latest}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    environment:
      <<: [*internal-auth]
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${STREAM_DB:-stream_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Global Service (Gateway) — always up, routes to screen and target
  # No depends_on screen/target: they are optional modules (profiled in local dev)
  global-service:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-global-service:${DOCKER_CHAPSMIND_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: [*keycloak-client, *keycloak-admin, *internal-auth]
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SERVICE_NAME: global-service
      API_HOST: "0.0.0.0"
      API_PORT: 8000
      GRPC_PORT: 50051
      SCREEN_BASE_URL: http://screen:8000
      STREAM_BASE_URL: ${STREAM_BASE_URL:-http://stream:8000}
      TARGET_BASE_URL: ${TARGET_BASE_URL:-http://target:8000}
      TARGET_MERCURE_URL: ${TARGET_MERCURE_URL:-http://target:8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${GLOBAL_DB:-global_db}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/ready")']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # PostgreSQL Database — shared instance, multiple databases (no profile — always up)
  # Databases: screen_db, global_db, stream_db, keycloak, target_db, n8n_db, agent_memory_db
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-screen_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./files/db/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-screen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RabbitMQ — Target message broker
  # Queues: target_async_priority_high, target_async_priority_low,
  #         target_agent_commands, target_agent_responses
  target-rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - target_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Target services ───────────────────────────────────────
  # dedicated OpenSearch, Valkey, N8N instances...

  # Target PHP/Symfony + FrankenPHP application
  target:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-target:${DOCKER_CHAPSMIND_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      target-rabbitmq: { condition: service_healthy }
      target-valkey: { condition: service_healthy }
      target-opensearch: { condition: service_healthy }
    environment:
      <<: *target-env
      SERVER_NAME: ":8000"
      # Mercure (FrankenPHP/Caddy embedded hub)
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}

  # Target runner — Symfony Messenger consumers
  target-runner:
    image: ${DOCKER_REGISTRY:-registry.git.mediaspeech.com/chapsmind/chapsmind}/chapsmind-target:${DOCKER_CHAPSMIND_VERSION:-latest}
    restart: unless-stopped
    deploy:
      replicas: ${TARGET_RUNNER_REPLICAS:-2}
    depends_on:
      db: { condition: service_healthy }
      target-rabbitmq: { condition: service_healthy }
      target-valkey: { condition: service_healthy }
    environment:
      <<: *target-env
    command:
      - "php"
      - "bin/console"
      - "messenger:consume"
      - "async_priority_high"
      - "async_priority_low"
      - "agent_commands"
      - "agent_responses"
      - "quality_processing"
      - "--time-limit=3600"
      - "--memory-limit=2G"
    healthcheck:
      test: ['CMD', 'php', 'bin/console', 'messenger:stats', '--format=json']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # OpenSearch — dedicated instance for Target
  target-opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.19.1}
    restart: unless-stopped
    volumes:
      - target_opensearch_data:/usr/share/opensearch/data
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Valkey 8 — dedicated cache/session store for Target
  target-valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - target_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # N8N — workflow automation engine (used by Target)
  n8n:
    image: n8nio/n8n:1.121.3
    profiles: [target]
    entrypoint: ['/chapsmind-entrypoint.sh']
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      n8n-import: { condition: service_completed_successfully }
    environment:
      <<: [*n8n-db, *n8n-default-user]
      N8N_HOST: "0.0.0.0"
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Europe/Paris
      N8N_METRICS: "true"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: internal
      N8N_RUNNERS_MAX_PAYLOAD: 1073741824
      N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-5}
      N8N_CONCURRENCY_PRODUCTION_LIMIT: ${N8N_CONCURRENCY_PRODUCTION_LIMIT:-20}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_JWT_SECRET:-!ChangeThisN8nJWTSecret!}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n/entrypoint.sh:/chapsmind-entrypoint.sh:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:5678/healthz/readiness']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # N8N Import — one-shot service to import workflows and credentials
  n8n-import:
    image: n8nio/n8n:1.121.3
    profiles: [target]
    entrypoint: /bin/sh
    command:
      - '-c'
      - |
        echo "Importing credentials..."
        n8n import:credentials --separate --input=/data/credentials || echo "Warning: Some credential imports had issues"

        echo "Importing workflows..."
        # Use || true because n8n may fail trying to remove webhooks for workflows that don't exist yet
        # This is expected on first run or after database reset
        n8n import:workflow --separate --input=/data/workflows 2>&1 || echo "Warning: Some workflow imports had issues (this is normal on first run)"

        if [ -n "$$N8N_WORKFLOWS_TO_ACTIVATE" ]; then
          echo "$$N8N_WORKFLOWS_TO_ACTIVATE" | tr ',' '\n' | while read workflow; do
            if [ -n "$$workflow" ]; then
              echo "Activating workflow: $$workflow"
              n8n update:workflow --id="$$workflow" --active=true || echo "Warning: Could not activate workflow $$workflow"
            fi
          done
        else
          echo "No specific workflows to activate. Use N8N_WORKFLOWS_TO_ACTIVATE environment variable to specify workflows (comma-separated IDs)"
        fi

        echo "Import completed successfully"
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *n8n-db
      N8N_WORKFLOWS_TO_ACTIVATE: ${N8N_WORKFLOWS_TO_ACTIVATE:-m3ykymXVS32Bdbph}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../apps/target/n8n/credentials:/data/credentials:ro
      - ../apps/target/n8n/workflows:/data/workflows:ro
volumes:
  postgres_data:
  target_rabbitmq_data:
  target_opensearch_data:
  target_valkey_data:
  n8n_data:
