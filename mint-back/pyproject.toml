[tool.poetry]
name = "mint-back"
version = "0.1.0"
description = "Mint Backend Service"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "0.100.0"
uvicorn = "0.22.0"
sqlalchemy = "2.0.17"
psycopg2-binary = "2.9.6"
pydantic = "2.0.2"
pydantic-settings = "2.0.1"
alembic = "1.11.1"
python-dotenv = "1.0.0"
httpx = "0.24.1"
asyncpg = "0.28.0"
aiohttp = "^3.12.7"
python-keycloak = "^3.9.1"
python-jose = "^3.3.0"
passlib = "^1.7.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 