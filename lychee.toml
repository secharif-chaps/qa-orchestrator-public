# lychee configuration — TAR-1534 / ADR-0016 D7
# Dead link detection for Markdown docs. Checks internal (relative paths
# between Markdown files), external (HTTP/HTTPS), and anchor fragments.
# Run via Docker image lycheeverse/lychee — no local Rust toolchain required.

# ─── Network ─────────────────────────────────────────
timeout = 20
max_retries = 2
retry_wait_time = 2
max_concurrency = 8

# Treat 200/206/429 as success. 429 (rate limited) is transient and would
# cause flaky CI; lychee retries a couple of times then accepts it.
accept = [200, 206, 429]

# ─── Exclusions ──────────────────────────────────────
exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://0\\.0\\.0\\.0",
  # Internal-only DNS not reachable from CI runners
  "^https?://([a-z0-9-]+\\.)*basil\\.local",
  "^https?://([a-z0-9-]+\\.)*chapsmind\\.local",
  # Mailto/tel are not link checks
  "^mailto:",
  "^tel:",
  # Slack Block Kit Builder requires authentication; URL is real but returns 403 unauthenticated
  "^https?://app\\.slack\\.com/",
  # Medium / Substack-style blogs aggressively block non-browser User-Agents (returns 403);
  # the URLs are real but unreachable from CI runners
  "^https?://([a-z0-9-]+\\.)*medium\\.com/",
  # Internal GitLab — most paths require authentication (401 from CI runners
  # that don't carry a token); the URLs are real but unreachable headlessly
  "^https?://git\\.mediaspeech\\.com/"
]

exclude_path = [
  "node_modules",
  ".git",
  ".cache"
]

# ─── Cache ───────────────────────────────────────────
# Cache successful responses to keep CI fast on repeated runs.
cache = true
max_cache_age = "1d"

# ─── Output ──────────────────────────────────────────
no_progress = true
