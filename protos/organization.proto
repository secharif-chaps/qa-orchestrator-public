syntax = "proto3";

package organization;

// Empty message for context request
message GetOrganizationContextRequest {
  string organization_id = 1;
}

// Organization context response
message GetOrganizationContextResponse {
  string organization_id = 1;
  string name = 2;
  repeated string enabled_modules = 3;
}

// Module check request
message IsModuleEnabledRequest {
  string organization_id = 1;
  string module_name = 2;
}

// Module check response
message IsModuleEnabledResponse {
  bool enabled = 1;
}

// Service definition
service OrganizationService {
  // Get full organization context
  rpc GetOrganizationContext(GetOrganizationContextRequest) returns (GetOrganizationContextResponse) {};
  
  // Check if a specific module is enabled for an organization
  rpc IsModuleEnabled(IsModuleEnabledRequest) returns (IsModuleEnabledResponse) {};
}