[tool.poetry]
name = "global-service"
version = "0.1.0"
description = "Chapsmind Global Service"
authors = ["Your Name <your.email@example.com>"]
package-mode = false
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
sqlalchemy = "^2.0.45"
psycopg2-binary = "^2.9.11"
pydantic-settings = "^2.12.0"
pydantic = "^2.12.5"
alembic = "^1.17.2"
grpcio = "^1.76.0"
grpcio-tools = "^1.76.0"
grpcio-reflection = "^1.76.0"
fastapi-keycloak = "^1.1.1"
cachetools = "^6.2.4"
httpx = "^0.28.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pyjwt = "^2.8.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
ruff = "^0.9.0"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require running services)",
]
# Skip integration tests by default (run with: pytest --run-integration)
addopts = "-m 'not integration'"

[tool.ruff]
exclude = ["app/grpc_generated/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
