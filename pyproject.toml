[tool.poetry]
name = "mint-back"
version = "0.1.0"
description = "Mint Backend Service"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9"
fastapi = ">=0.115"
uvicorn = "0.22.0"
sqlalchemy = ">=2.0.35"
psycopg2-binary = ">=2.9.10"
pydantic = ">=2.10"
pydantic-settings = "2.0.1"
alembic = "1.11.1"
python-dotenv = "1.0.0"
httpx = "0.24.1"
asyncpg = ">=0.30.0"
aiohttp = "^3.12.7"
python-keycloak = "^3.9.1"
python-jose = "^3.3.0"
passlib = "^1.7.4"
email-validator = "^2.0.0"
celery = "^5.3.4"
flower = "^2.0.1"
kombu = "^5.3.4"
starlette = ">=0.36"
fastapi-keycloak = "1.1.1"
dify-client = "^0.1.10"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
setuptools = "^80.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 