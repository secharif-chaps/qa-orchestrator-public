services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mint_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: 
      context: ./mint-back
    depends_on:
      db:
        condition: service_healthy
    restart: always
    env_file:
      - .env.production
    ports:
      - "8000:8000"

  # Nuxt Frontend
  frontend:
    build:
      context: ./mint-front
    restart: always
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Keycloak for Authentication
  keycloak:
    image: quay.io/keycloak/keycloak:20.0
    restart: unless-stopped
    env_file:
      - .env.production
    command: start-dev --import-realm
    volumes:
      - ./docker/keycloak/realm-mint-dev.json:/opt/keycloak/data/import/realm-mint-dev.json
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: 
