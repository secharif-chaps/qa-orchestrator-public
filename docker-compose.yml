services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./files/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - keycloak
      - frontend
    networks:
      - mint-network

  # Vue Frontend
  frontend:
    image: registry.git.mediaspeech.com/mint/screen-front/mint-front:preprod
    restart: always
    networks:
      - mint-network

  # FastAPI Backend
  backend:
    image: registry.git.mediaspeech.com/mint/screen-poc/mint-back:preprod
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mint_db
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: mint-dev
      KEYCLOAK_CLIENT_ID: mint-back
      KEYCLOAK_CLIENT_SECRET: 
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      CORS_ORIGIN: http://localhost
      API_PORT: 8000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      MAX_CONCURRENT_WORKFLOWS: 10
      BACKEND_BASE_URL: http://localhost
      # Translation API (runs in backend via BackgroundTasks)
      SYSTRAN_API_KEY: ${SYSTRAN_API_KEY}
    networks:
      - mint-network

  # Celery Worker for Task Processing
  backend_celery_worker:
    image: registry.git.mediaspeech.com/mint/screen-poc/mint-back:preprod
    entrypoint: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --pool=solo --queues=dify_workflows
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mint_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672//
      MAX_CONCURRENT_WORKFLOWS: 10
      BACKEND_BASE_URL: http://localhost
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - mint-network

  backend_celery_flower:
    image: registry.git.mediaspeech.com/mint/screen-poc/mint-back:preprod
    entrypoint: celery -A app.core.celery_app flower --port=5555 --broker=amqp://guest:guest@rabbitmq:5672//
    restart: always
    ports:
      - "5555:5555"
    environment:
      FLOWER_BASIC_AUTH: admin:admin
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - mint-network

  # Keycloak for Authentication
  keycloak:
    image: keycloak/keycloak:26.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_FEATURES: organization
    command: start-dev --import-realm
    volumes:
      - ./files/realm-chapsmind.json:/opt/keycloak/data/import/realm-chapsmind.json
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mint-network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mint_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./files/db/initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mint-network
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    restart: always
    ports:
      - "5672:5672"     # AMQP port
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - mint-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  mint-network:
    driver: bridge