services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mint_db
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-!ChangeMe!}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/initdb.d:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: 
      context: ./mint-back
    depends_on:
      db:
        condition: service_healthy
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mint_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - N8N_BASE_URL=http://ec2-34-244-245-92.eu-west-1.compute.amazonaws.com:5678
      - N8N_WEBHOOK_ID=57be7c18-e8b2-47aa-b9aa-f7c2696f4523
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - "8000:8000"

  # Nuxt Frontend
  frontend:
    build:
      context: ./mint-front
    restart: always
    environment:
      - NUXT_PUBLIC_BACKEND_API=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Keycloak for Authentication
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-postgres}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-!ChangeMe!}
      KEYCLOAK_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME:-keycloak}
    command: start-dev --import-realm
    volumes:
      - ./docker/keycloak/realm-mint-dev.json:/opt/keycloak/data/import/realm-mint-dev.json
      - ./docker/keycloak/mint-theme:/opt/keycloak/themes/mint
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: 

  