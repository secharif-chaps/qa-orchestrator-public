# https://taskfile.dev
version: '3'

includes:
  front:
    taskfile: apps/front/Taskfile.yaml
    dir: apps/front
  global-service:
    taskfile: apps/global-service/Taskfile.yaml
  screen:
    taskfile: apps/screen/Taskfile.yaml
  stream:
    taskfile: apps/stream/Taskfile.yaml
  target:
    taskfile: apps/target/Taskfile.yaml

dotenv: ['.env']

vars:
  COMPOSE: docker compose

tasks:
  # ─── Setup ─────────────────────────────────────────
  init:
    desc: "One-shot first-time setup: env, deps, services, keycloak, migrations"
    silent: true
    cmd: bash infra/scripts/init.sh

  doctor:
    desc: Check that all prerequisites are installed and configured
    silent: true
    cmd: bash infra/scripts/doctor.sh

  # ─── Infrastructure ────────────────────────────────
  up:
    desc: Start all services (docker compose up)
    cmd: "{{.COMPOSE}} up -d --build --remove-orphans"

  down:
    desc: Stop all services
    cmd: "{{.COMPOSE}} down"

  restart:
    desc: Recreate all services
    cmd: "{{.COMPOSE}} up -d --force-recreate"

  logs:
    desc: Tail all service logs
    cmd: "{{.COMPOSE}} logs -f"

  logs:service:
    desc: Tail logs for a specific service
    cmd: "{{.COMPOSE}} logs -f {{.CLI_ARGS}}"

  # ─── Profiles ──────────────────────────────────────
  profile:
    desc: Interactive selector for active Docker Compose profiles
    silent: true
    cmd: bash infra/scripts/profile.sh

  profile:add:
    desc: "Activate a profile (e.g. task profile:add -- screen)"
    silent: true
    cmd: bash infra/scripts/profile.sh add {{.CLI_ARGS}}

  profile:remove:
    desc: "Deactivate a profile (e.g. task profile:remove -- screen)"
    silent: true
    cmd: bash infra/scripts/profile.sh remove {{.CLI_ARGS}}

  profile:list:
    desc: List active and available Docker Compose profiles
    silent: true
    cmd: bash infra/scripts/profile.sh list

  # ─── Database ──────────────────────────────────────
  migrate:
    desc: Run Alembic migrations (screen + stream)
    silent: true
    cmds:
      - |
        if {{.COMPOSE}} ps --services --filter "status=running" 2>/dev/null | grep -q "^screen$"; then
          {{.COMPOSE}} exec screen alembic upgrade head
        else
          echo "⚠  screen is not running — migration skipped"
        fi
      - |
        if {{.COMPOSE}} ps --services --filter "status=running" 2>/dev/null | grep -q "^stream$"; then
          {{.COMPOSE}} exec stream alembic upgrade head
        else
          echo "⚠  stream is not running — migration skipped"
        fi

  migrate:status:
    desc: Show current migration version (screen + stream)
    silent: true
    cmds:
      - echo "── screen ──"
      - |
        if {{.COMPOSE}} ps --services --filter "status=running" 2>/dev/null | grep -q "^screen$"; then
          {{.COMPOSE}} exec screen alembic current
        else
          echo "⚠  screen is not running — skipped"
        fi
      - echo "── stream ──"
      - |
        if {{.COMPOSE}} ps --services --filter "status=running" 2>/dev/null | grep -q "^stream$"; then
          {{.COMPOSE}} exec stream alembic current
        else
          echo "⚠  stream is not running — skipped"
        fi

  seed:
    desc: Seed sample data
    cmd: "{{.COMPOSE}} exec screen python seed-sample-data.py"

  db:shell:
    desc: Open psql shell
    cmd: "{{.COMPOSE}} exec db psql -U postgres -d chapsmind_db"

  # ─── Skills ────────────────────────────────────────
  skills:validate:
    desc: Validate Claude skills structure
    cmd: for dir in .claude/skills/*/; do npx skills-ref validate "$dir" || exit 1; done

  # ─── All ────────────────────────────────────────────
  lint:
    desc: Lint all projects
    deps: [front:lint, screen:lint, stream:lint, target:lint]

  test:
    desc: Run all tests
    deps: [front:test, screen:test, stream:test, target:test]
