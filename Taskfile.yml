# https://taskfile.dev
version: '3'

includes:
  front:
    taskfile: apps/front/Taskfile.yaml
    dir: apps/front

dotenv: ['.env']

vars:
  COMPOSE: docker compose

tasks:
  # ─── Setup ─────────────────────────────────────────
  init:
    desc: "One-shot first-time setup: env, deps, services, keycloak, migrations"
    cmd: bash infra/scripts/init.sh

  doctor:
    desc: Check that all prerequisites are installed and configured
    cmd: bash infra/scripts/doctor.sh

  front:setup-yarnrc:
    desc: Create or update apps/front/.yarnrc.yml from template
    cmd: bash infra/scripts/setup-yarnrc.sh

  # ─── Infrastructure ────────────────────────────────
  up:
    desc: Start all services (docker compose up)
    cmds:
      - "{{.COMPOSE}} build screen"
      - "{{.COMPOSE}} up -d --build"

  down:
    desc: Stop all services
    cmd: "{{.COMPOSE}} down"

  restart:
    desc: Restart all services
    cmd: "{{.COMPOSE}} restart"

  logs:
    desc: Tail all service logs
    cmd: "{{.COMPOSE}} logs -f"

  logs:service:
    desc: Tail logs for a specific service
    cmd: "{{.COMPOSE}} logs -f {{.CLI_ARGS}}"

  # ─── Database ──────────────────────────────────────
  migrate:
    desc: Run Alembic migrations
    cmd: "{{.COMPOSE}} exec screen alembic upgrade head"

  migrate:status:
    desc: Show current migration version
    cmd: "{{.COMPOSE}} exec screen alembic current"

  seed:
    desc: Seed sample data
    cmd: "{{.COMPOSE}} exec screen python seed-sample-data.py"

  db:shell:
    desc: Open psql shell
    cmd: "{{.COMPOSE}} exec db psql -U postgres -d chapsmind_db"

  # ─── Frontend (tasks not covered by include) ──────
  front:dev:
    desc: Start frontend dev server (HMR)
    dir: apps/front
    cmd: yarn dev

  front:build:
    desc: Build frontend for production
    dir: apps/front
    cmd: yarn build

  # ─── Screen Backend ───────────────────────────────
  screen:lint:
    desc: Lint screen backend code (ruff)
    cmd: "{{.COMPOSE}} exec screen ruff check ."

  screen:format:
    desc: Format screen backend code (ruff)
    cmd: "{{.COMPOSE}} exec screen ruff format ."

  screen:test:
    desc: Run screen backend tests
    cmd: "{{.COMPOSE}} exec screen pytest"

  screen:shell:
    desc: Open bash shell in screen backend container
    cmd: "{{.COMPOSE}} exec screen bash"

  # ─── Tunnel (Dify callbacks) ─────────────────────
  tunnel:
    desc: Start LocalTunnel for Dify callbacks
    cmds:
      - "{{.COMPOSE}} --profile tunnel up -d tunnel"
      - sleep 5
      - "{{.COMPOSE}} logs tunnel --tail 10"

  tunnel:stop:
    desc: Stop the tunnel
    cmd: "{{.COMPOSE}} --profile tunnel stop tunnel"

  tunnel:url:
    desc: Show current tunnel URL
    cmd: "curl -s http://localhost:8000/api/dev/tunnel-url | python3 -m json.tool || {{.COMPOSE}} logs tunnel --tail 5"

  tunnel:logs:
    desc: Follow tunnel logs
    cmd: "{{.COMPOSE}} logs -f tunnel"

  # ─── Sync (transitional — pull from legacy repos) ──
  sync:
    desc: Pull latest commits from all legacy repos
    cmd: bash scripts/subtree-sync.sh

  sync:module:
    desc: "Pull latest from a legacy repo (e.g. task sync:module -- front)"
    cmd: bash scripts/subtree-sync.sh {{.CLI_ARGS}}

  # ─── Git Hooks ─────────────────────────────────────
  hooks:install:
    desc: Install git hooks (husky)
    cmd: yarn install

  # ─── Skills ────────────────────────────────────────
  skills:validate:
    desc: Validate Claude skills structure
    cmd: for dir in .claude/skills/*/; do npx skills-ref validate "$dir" || exit 1; done

  # ─── All ────────────────────────────────────────────
  lint:
    desc: Lint all projects
    deps: [front:lint, screen:lint]

  test:
    desc: Run all tests
    deps: [front:test, screen:test]
